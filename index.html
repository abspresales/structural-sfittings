<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
// ========== 后台维护 - Excel导入更新 ==========
let pendingUpdate = null; // 待保存的更新数据

// 拖拽上传
document.addEventListener('DOMContentLoaded', function(){
  const uploadArea = document.getElementById('uploadArea');
  if(uploadArea){
    uploadArea.addEventListener('dragover', function(e){
      e.preventDefault();
      this.classList.add('dragover');
    });
    uploadArea.addEventListener('dragleave', function(e){
      e.preventDefault();
      this.classList.remove('dragover');
    });
    uploadArea.addEventListener('drop', function(e){
      e.preventDefault();
      this.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if(file) handleFileUpload(file);
    });
  }
});

// 处理文件上传
function handleFileUpload(file){
  if(!file) return;
  
  // 检查文件类型
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext !== 'xlsx' && ext !== 'xls'){
    alert('请上传 .xlsx 或 .xls 格式的Excel文件');
    return;
  }
  
  document.getElementById('uploadFileName').style.display = 'block';
  document.getElementById('uploadFileName').textContent = '已选择文件：' + file.name;
  document.getElementById('progressTip').style.display = 'block';
  document.getElementById('progressTip').textContent = '正在解析Excel文件...';
  
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type:'array'});
      parseAndCompare(workbook);
    }catch(err){
      document.getElementById('progressTip').textContent = '解析失败：' + err.message;
      document.getElementById('progressTip').style.background = '#fff2f0';
      document.getElementById('progressTip').style.borderColor = '#ffccc7';
      document.getElementById('progressTip').style.color = '#cf1322';
    }
  };
  reader.readAsArrayBuffer(file);
}

// 解析Excel并对比数据
function parseAndCompare(workbook){
  document.getElementById('progressTip').textContent = '正在对比数据...';
  
  const newAllData = {};
  const newInputMap = {};
  const newMergeMap = {};
  const summary = [];
  let totalNew = 0, totalUpdated = 0, totalSheets = 0;
  
  workbook.SheetNames.forEach(sheetName => {
    const worksheet = workbook.Sheets[sheetName];
    const sheetData = {};
    const inputs = [];
    const merges = [];
    
    // 解析合并单元格
    if(worksheet['!merges']){
      worksheet['!merges'].forEach(merge => {
        const startCol = numToCol(merge.s.c + 1);
        const startRow = merge.s.r + 1;
        const endCol = numToCol(merge.e.c + 1);
        const endRow = merge.e.r + 1;
        merges.push(startCol + startRow + ':' + endCol + endRow);
      });
    }
    
    // 解析单元格数据
    for(const ref in worksheet){
      if(ref[0] === '!') continue;
      const cell = worksheet[ref];
      let val = '';
      if(cell.t === 's'){
        val = cell.v;
      }else if(cell.t === 'n'){
        val = String(cell.v);
      }else if(cell.t === 'b'){
        val = cell.v ? 'TRUE' : 'FALSE';
      }else if(cell.v !== undefined){
        val = String(cell.v);
      }
      
      if(val !== ''){
        sheetData[ref] = {v: val};
        
        // 识别输入框（橙色背景）
        if(cell.s && cell.s.fgColor && (cell.s.fgColor.rgb === 'FFFFC000' || cell.s.fgColor.rgb === 'FFC000')){
          inputs.push(ref);
        }
      }
    }
    
    newAllData[sheetName] = sheetData;
    if(inputs.length > 0) newInputMap[sheetName] = inputs;
    if(merges.length > 0) newMergeMap[sheetName] = merges;
    
    // 对比数据
    const oldSheetData = ALL_DATA[sheetName] || {};
    let newCount = 0, updatedCount = 0;
    
    for(const ref in sheetData){
      if(!oldSheetData[ref]){
        newCount++;
      }else if(oldSheetData[ref].v !== sheetData[ref].v){
        updatedCount++;
      }
    }
    
    totalNew += newCount;
    totalUpdated += updatedCount;
    totalSheets++;
    
    summary.push({
      sheetName: sheetName,
      oldCount: Object.keys(oldSheetData).length,
      newCount: newCount,
      updatedCount: updatedCount,
      totalCount: Object.keys(sheetData).length,
      status: (newCount > 0 || updatedCount > 0) ? '有更新' : '无变化'
    });
  });
  
  // 保存待更新数据
  pendingUpdate = {
    allData: newAllData,
    inputMap: newInputMap,
    mergeMap: newMergeMap,
    summary: summary
  };
  
  // 显示更新统计
  showUpdateSummary(summary, totalNew, totalUpdated, totalSheets);
  
  document.getElementById('progressTip').textContent = '解析完成！请确认后点击保存';
  document.getElementById('saveBtn').style.display = 'inline-block';
}

// 显示更新统计
function showUpdateSummary(summary, totalNew, totalUpdated, totalSheets){
  const tbody = document.querySelector('#summaryTable tbody');
  tbody.innerHTML = '';
  
  summary.forEach(item => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + item.sheetName + '</td>' +
                   '<td>' + item.oldCount + '</td>' +
                   '<td style="color:#389e0d">' + (item.newCount > 0 ? '+' + item.newCount : '0') + '</td>' +
                   '<td style="color:#fa8c16">' + (item.updatedCount > 0 ? item.updatedCount : '0') + '</td>' +
                   '<td style="color:' + (item.status === '有更新' ? '#389e0d' : '#999') + '">' + item.status + '</td>';
    tbody.appendChild(tr);
  });
  
  document.getElementById('summaryTotal').textContent = 
    '共 ' + totalSheets + ' 个Sheet，新增 ' + totalNew + ' 条数据，更新 ' + totalUpdated + ' 条数据';
  
  document.getElementById('updateSummary').style.display = 'block';
}

// 保存更新
function saveUpdate(){
  if(!pendingUpdate && !pendingAttachments){
    alert('没有待保存的更新数据');
    return;
  }
  
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = '正在保存...';
  
  try {
    // 保存Excel数据
    if(pendingUpdate){
      Object.assign(ALL_DATA, pendingUpdate.allData);
      Object.assign(INPUT_MAP, pendingUpdate.inputMap);
      Object.assign(MERGE_MAP, pendingUpdate.mergeMap);
      
      // 更新下拉选项
      const sheetSelect = document.getElementById('sheetSelect');
      const currentValue = sheetSelect.value;
      sheetSelect.innerHTML = '';
      Object.keys(ALL_DATA).forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        sheetSelect.appendChild(option);
      });
      if(ALL_DATA[currentValue]){
        sheetSelect.value = currentValue;
      }else{
        currentSheet = Object.keys(ALL_DATA)[0];
        sheetSelect.value = currentSheet;
      }
    }
    
    // 保存附件数据
    if(pendingAttachments){
      ATTACHMENTS = JSON.parse(JSON.stringify(pendingAttachments));
    }
    
    // 重新渲染
    renderTable();
    updateAttachmentDisplay();
    
    // 重置状态
    pendingUpdate = null;
    pendingAttachments = null;
    
    // 重置UI
    saveBtn.disabled = false;
    saveBtn.textContent = '保存并全覆盖';
    saveBtn.style.display = 'none';
    document.getElementById('updateSummary').style.display = 'none';
    document.getElementById('uploadFileName').style.display = 'none';
    document.getElementById('progressTip').style.display = 'none';
    document.getElementById('excelFile').value = '';
    
    // 关闭弹窗
    closeAdminModal();
    
    // 成功提示
    setTimeout(function(){
      alert('保存成功！数据已更新并刷新页面');
    }, 100);
    
  } catch(e) {
    console.error('保存错误:', e);
    saveBtn.disabled = false;
    saveBtn.textContent = '保存并全覆盖';
    alert('保存失败：' + e.message);
  }
}

// 关闭后台维护弹窗
function closeAdminModal(){
  closeModal('adminModal');
  // 重置状态
  pendingUpdate = null;
  const saveBtn = document.getElementById('saveBtn');
  if(saveBtn){
    saveBtn.disabled = false;
    saveBtn.textContent = '保存并全覆盖';
    saveBtn.style.display = 'none';
  }
  const summary = document.getElementById('updateSummary');
  if(summary) summary.style.display = 'none';
  const fileName = document.getElementById('uploadFileName');
  if(fileName) fileName.style.display = 'none';
  const progress = document.getElementById('progressTip');
  if(progress){
    progress.style.display = 'none';
    progress.style.background = '';
    progress.style.borderColor = '';
    progress.style.color = '';
  }
  const excelFile = document.getElementById('excelFile');
  if(excelFile) excelFile.value = '';
}

function renderAttachmentList(){

  list.innerHTML = '';
  
  sheetNames.forEach(sheetName => {
    const item = document.createElement('div');
    item.className = 'attachment-item';
    
    const att = pendingAttachments && pendingAttachments[sheetName] ? pendingAttachments[sheetName] : (ATTACHMENTS[sheetName] || {});

// 上传附件
function uploadAttachment(sheetName, fileType){
  const input = document.createElement('input');
  input.type = 'file';
  if(fileType === 'dwg'){
    input.accept = '.dwg,.dxf';
  }else{
    input.accept = '.pdf';
  }
  
  input.onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    
    const reader = new FileReader();
    reader.onload = function(ev){
      if(!pendingAttachments) pendingAttachments = {};
      if(!pendingAttachments[sheetName]) pendingAttachments[sheetName] = {};
      
      pendingAttachments[sheetName][fileType] = {
        name: file.name,
        data: ev.target.result, // base64 data URL
        type: file.type
      };
      
      renderAttachmentList();
    };
    reader.readAsDataURL(file);
  };
  
  input.click();
}

// 删除附件
function deleteAttachment(sheetName, fileType){
  if(!pendingAttachments || !pendingAttachments[sheetName]) return;
  delete pendingAttachments[sheetName][fileType];
  renderAttachmentList();
}

// 渲染前台附件下载区
function updateAttachmentDisplay(){
  const container = document.getElementById('attachmentContainer');
  if(!container) return;
  
  const att = ATTACHMENTS[currentSheet];
  if(!att || (!att.dwg && !att.pdf)){
    // 没有附件时保留硬编码的测试附件，或者清空
    // container.innerHTML = '';
    return;
  }
  
  let html = '<div class="sheet-attachments">';
  html += '<span class="label">附件下载：</span>';
  
  if(att.dwg){
    html += '<a class="download-link" href="' + att.dwg.data + '" download="' + att.dwg.name + '">' +
            '<span class="icon">&#128230;</span> DWG文件：' + att.dwg.name + '</a>';
  }
  
  if(att.pdf){
    html += '<a class="download-link" href="' + att.pdf.data + '" download="' + att.pdf.name + '">' +
            '<span class="icon">&#128196;</span> PDF文件：' + att.pdf.name + '</a>';
  }
  
  html += '</div>';
  container.innerHTML = html;
}

function numToCol(n){
  let s='';
  while(n>0){
    let r=(n-1)%26;
    n=Math.floor((n-1)/26);
    s=String.fromCharCode(65+r)+s;
  }
  return s;
}

function buildSheetMergeMap(sheetName){
  const ranges = MERGE_MAP[sheetName] || [];
  const m = {};
  for(const rng of ranges){
    const [start,end] = rng.split(':');
    const startCol = start.match(/[A-Z]+/)[0];
    const startRow = parseInt(start.match(/\d+/)[0]);
    const endCol = end.match(/[A-Z]+/)[0];
    const endRow = parseInt(end.match(/\d+/)[0]);
    const colToNum = (c)=>{let n=0;for(const ch of c)n=n*26+(ch.charCodeAt(0)-64);return n;};
    const startCi = colToNum(startCol);
    const endCi = colToNum(endCol);
    const colspan = endCi - startCi + 1;
    const rowspan = endRow - startRow + 1;
    for(let r=startRow;r<=endRow;r++){
      for(let ci=startCi;ci<=endCi;ci++){
        const key = r+'_'+ci;
        if(r===startRow && ci===startCi){
          m[key] = {merged:false,colspan,rowspan};
        } else {
          m[key] = {merged:true};
        }
      }
    }
  }
  return m;
}

function disp(c){
  if(!c) return '';
  let v = c.v || '';
  return String(v);
}


// ========== 公式自动计算 ==========
function evalExcelFormula(formula, values){
  if(!formula) return '';
  let expr = formula.trim();
  
  // 替换单元格引用为值
  const refs = [];
  expr = expr.replace(/([A-Z]+)(\d+)/g, function(match, col, row){
    const ref = col + row;
    refs.push(ref);
    return '___REF_' + refs.length + '___';
  });
  
  for(let i=0; i<refs.length; i++){
    const ref = refs[i];
    let val = 0;
    if(values[ref] !== undefined && values[ref] !== '' && !isNaN(parseFloat(values[ref]))){
      val = parseFloat(values[ref]);
    }
    expr = expr.replace('___REF_' + (i+1) + '___', val);
  }
  
  // 替换Excel函数
  expr = expr.replace(/ROUNDDOWN\(/g, 'Math.floor(');
  expr = expr.replace(/ROUNDUP\(/g, 'Math.ceil(');
  expr = expr.replace(/ROUND\(/g, 'Math.round(');
  expr = expr.replace(/CEILING\(/g, 'Math.ceil(');
  expr = expr.replace(/MAX\(/g, 'Math.max(');
  expr = expr.replace(/<>/g, '!=');
  
  // 替换Excel的=比较为JavaScript的==（但不替换<=, >=, !=）
  expr = expr.replace(/([^<>!=])=([^=])/g, '$1==$2');
  expr = expr.replace(/^=([^=])/, '==$1');
  
  // 处理MOD函数
  while(expr.includes('MOD(')){
    const idx = expr.indexOf('MOD(');
    let depth = 1;
    let start = idx + 4;
    let commaIdx = -1;
    let endIdx = -1;
    for(let i=start; i<expr.length; i++){
      if(expr[i] === '(') depth++;
      if(expr[i] === ')'){
        depth--;
        if(depth === 0){ endIdx = i; break; }
      }
      if(expr[i] === ',' && depth === 1 && commaIdx === -1) commaIdx = i;
    }
    if(commaIdx > 0 && endIdx > 0){
      const a = expr.substring(start, commaIdx);
      const b = expr.substring(commaIdx+1, endIdx);
      expr = expr.substring(0, idx) + '((' + a + ')%(' + b + '))' + expr.substring(endIdx+1);
    } else break;
  }
  
  // 处理OR函数
  while(expr.includes('OR(')){
    const idx = expr.indexOf('OR(');
    let depth = 1;
    let start = idx + 3;
    let endIdx = -1;
    for(let i=start; i<expr.length; i++){
      if(expr[i] === '(') depth++;
      if(expr[i] === ')'){
        depth--;
        if(depth === 0){ endIdx = i; break; }
      }
    }
    if(endIdx > 0){
      const args = expr.substring(start, endIdx);
      expr = expr.substring(0, idx) + '((' + args.replace(/,/g, ')||(') + '))' + expr.substring(endIdx+1);
    } else break;
  }
  
  // 处理IF函数
  let maxIter = 20;
  while(expr.includes('IF(') && maxIter-- > 0){
    const idx = expr.indexOf('IF(');
    let depth = 1;
    let start = idx + 3;
    let comma1 = -1;
    let comma2 = -1;
    let endIdx = -1;
    for(let i=start; i<expr.length; i++){
      if(expr[i] === '(') depth++;
      if(expr[i] === ')'){
        depth--;
        if(depth === 0){ endIdx = i; break; }
      }
      if(expr[i] === ',' && depth === 1){
        if(comma1 === -1) comma1 = i;
        else if(comma2 === -1) comma2 = i;
      }
    }
    if(comma1 > 0 && comma2 > 0 && endIdx > 0){
      const cond = expr.substring(start, comma1);
      const trueVal = expr.substring(comma1+1, comma2);
      const falseVal = expr.substring(comma2+1, endIdx);
      expr = expr.substring(0, idx) + '((' + cond + ')?(' + trueVal + '):(' + falseVal + '))' + expr.substring(endIdx+1);
    } else break;
  }
  
  // 处理SUM函数
  while(expr.includes('SUM(')){
    const idx = expr.indexOf('SUM(');
    let depth = 1;
    let start = idx + 4;
    let endIdx = -1;
    for(let i=start; i<expr.length; i++){
      if(expr[i] === '(') depth++;
      if(expr[i] === ')'){
        depth--;
        if(depth === 0){ endIdx = i; break; }
      }
    }
    if(endIdx > 0){
      expr = expr.substring(0, idx) + '0' + expr.substring(endIdx+1);
    } else break;
  }
  
  try {
    const result = eval(expr);
    if(typeof result === 'number' && !isNaN(result) && isFinite(result)){
      return Math.round(result * 1000) / 1000;
    }
    return result;
  } catch(e) {
    console.error('公式计算错误:', formula, expr, e.message);
    return '';
  }
}

function recalculateFormulas(){
  const sheetData = ALL_DATA[currentSheet];
  if(!sheetData) return;
  
  const values = {};
  
  for(const ref in sheetData){
    const cell = sheetData[ref];
    if(cell && !cell.f && cell.v !== '' && !isNaN(parseFloat(cell.v))){
      values[ref] = parseFloat(cell.v);
    }
  }
  
  document.querySelectorAll('input[data-ref]').forEach(input => {
    const ref = input.getAttribute('data-ref');
    if(input.value !== '' && !isNaN(parseFloat(input.value))){
      values[ref] = parseFloat(input.value);
    }
  });
  
  for(let iter=0; iter<15; iter++){
    let changed = false;
    for(const ref in sheetData){
      const cell = sheetData[ref];
      if(cell && cell.f){
        const result = evalExcelFormula(cell.f, values);
        if(result !== '' && result !== values[ref]){
          values[ref] = result;
          changed = true;
        }
      }
    }
    if(!changed) break;
  }
  
  document.querySelectorAll('td[data-formula-ref]').forEach(td => {
    const ref = td.getAttribute('data-formula-ref');
    if(values[ref] !== undefined){
      td.textContent = values[ref];
    }
  });
}

function renderTable(){
  const sheetData = ALL_DATA[currentSheet] || {};
  const inputs = INPUT_MAP[currentSheet] || [];
  const sheetMergeMap = buildSheetMergeMap(currentSheet);
  
  // 计算最大行和最大列
  let maxRow = 0;
  let maxCol = 9;
  for(const ref in sheetData){
    const m = ref.match(/([A-Z]+)(\d+)/);
    if(m){
      const row = parseInt(m[2]);
      if(row > maxRow) maxRow = row;
    }
  }
  // 合并单元格扩展maxCol
  for(const rng of (MERGE_MAP[currentSheet]||[])){
    const end = rng.split(':')[1];
    const endCol = end.match(/[A-Z]+/)[0];
    const colToNum = (c)=>{let n=0;for(const ch of c)n=n*26+(ch.charCodeAt(0)-64);return n;};
    if(colToNum(endCol) > maxCol) maxCol = colToNum(endCol);
  }
  
  const container = document.getElementById('tableContainer');
  let html = '';
  let inSection = false;
  
  for(let rNum=1; rNum<=maxRow; rNum++){
    const rowCells = {};
    for(let ci=1; ci<=maxCol; ci++){
      const col = numToCol(ci);
      const ref = col + rNum;
      rowCells[ref] = sheetData[ref];
    }
    
    const aVal = disp(rowCells['A'+rNum]);
    const bVal = disp(rowCells['B'+rNum]);
    const cVal = disp(rowCells['C'+rNum]);
    
    // 判断行类型
    const isNote = aVal && /PS：|注：|备注|仅供参考|请勿|暂未|注意/.test(aVal);
    const isSection = aVal && /[（(].*[)）]：?$/.test(aVal) && !/最大支持|排列方式|计算公式/.test(aVal) && aVal.length < 60;
    const isInputHeader = (/Width|Height|Quantity|宽度|高度|数量/.test(bVal+cVal) && !inputs.includes('B'+rNum));
    const isInputRow = aVal && /排列方式|Input screen/.test(aVal);
    
    // 第1行：标题栏
    if(rNum === 1){
      if(inSection){html += '</tbody></table></div></div>'; inSection=false;}
      html += '<div class="note-bar">'+aVal+'</div>';
      continue;
    }
    
    // section标题行
    if(isSection){
      if(inSection) html += '</tbody></table></div></div>';
      html += '<div class="table-section"><div class="table-section-title">'+aVal+'</div><div class="table-wrapper"><table class="data-table"><tbody>';
      inSection = true;
      continue;
    }
    
    // 确保在表格中
    if(!inSection){
      const hasContent = Object.values(rowCells).some(c=>disp(c)!=='');
      if(!hasContent) continue;
      html += '<div class="table-section"><div class="table-wrapper"><table class="data-table"><tbody>';
      inSection = true;
    }
    
    const rowHasContent = Object.values(rowCells).some(c=>disp(c)!=='');
    if(!rowHasContent) continue;
    
    let rowClass = isNote ? 'note-row' : (isSection ? 'section-header' : (isInputHeader ? 'input-header' : (isInputRow ? 'input-row' : '')));
    html += '<tr class="'+rowClass+'">';
    
    const rowHasInput = inputs.includes('B'+rNum);
    
    for(let ci=1; ci<=maxCol; ci++){
      const col = numToCol(ci);
      const ref = col + rNum;
      const c = rowCells[ref];
      const val = disp(c);
      let tdClass = '';
      const mergeInfo = sheetMergeMap[rNum+'_'+ci];
      
      if(mergeInfo && mergeInfo.merged) continue;
      
      let mergeAttr = '';
      if(mergeInfo){
        if(mergeInfo.rowspan > 1){mergeAttr += ' rowspan="'+mergeInfo.rowspan+'"'; tdClass += ' row-merge';}
        if(mergeInfo.colspan > 1){mergeAttr += ' colspan="'+mergeInfo.colspan+'"'; tdClass += ' col-merge';}
      }
      
      // 公式单元格添加标记
      if(c && c.f){
        tdClass += ' formula-cell';
        html += '<td class="'+tdClass+'"'+mergeAttr+' data-formula-ref="'+ref+'">'+val+'</td>';
        continue;
      }
      
      // 特殊class
      if(col === 'B' && val !== '' && !isNaN(parseFloat(val))) tdClass += ' cell-qty';
      if(/重量|Weight|KG/.test(val)) tdClass += ' cell-weight';
      if(/请在左侧输入/.test(val)) tdClass += ' hint-cell';
      
      // 数字单元格居中（纯数字，且不是表头行）
      if(!isInputHeader && !isSection && !isNote && val !== '' && !isNaN(parseFloat(val)) && /^\d+\.?\d*$/.test(val.trim())){
        tdClass += ' num-cell';
      }
      // 物料描述列居左（长文本）
      if(!isInputHeader && !isSection && !isNote && val.length > 20 && !/^\d/.test(val)){
        tdClass += ' desc-cell';
      }
      
      // 输入框
      if(inputs.includes(ref)){
        html += '<td class="'+tdClass+'"'+mergeAttr+'><input type="number" min="0" value="'+val+'" data-ref="'+ref+'" onchange="recalculateFormulas()"></td>';
        continue;
      }
      
      // 普通单元格 - 换行处理
      let dispVal = val.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
      html += '<td class="'+tdClass+'"'+mergeAttr+'>'+dispVal+'</td>';
    }
    html += '</tr>';
  }
  
  if(inSection) html += '</tbody></table></div></div>';
  
  container.innerHTML = html;
}

function exportExcel(){
  // 简单的CSV导出
  const sheetData = ALL_DATA[currentSheet] || {};
  const inputs = INPUT_MAP[currentSheet] || [];
  
  let maxRow = 0;
  let maxCol = 9;
  for(const ref in sheetData){
    const m = ref.match(/([A-Z]+)(\d+)/);
    if(m){
      const row = parseInt(m[2]);
      if(row > maxRow) maxRow = row;
    }
  }
  
  let csv = '\uFEFF';
  for(let r=1; r<=maxRow; r++){
    const row = [];
    for(let ci=1; ci<=maxCol; ci++){
      const col = numToCol(ci);
      const ref = col + r;
      const c = sheetData[ref];
      let v = c ? (c.v || '') : '';
      v = String(v).replace(/\n/g, ' ').replace(/"/g, '""');
      row.push('"'+v+'"');
    }
    csv += row.join(',') + '\n';
  }
  
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = currentSheet + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// Excel日期序列号转日期
function excelDateToDate(serial){
  if(!serial || isNaN(parseFloat(serial))) return serial;
  const utcDays = Math.floor(serial - 25569);
  const utcValue = utcDays * 86400;
  const dateInfo = new Date(utcValue * 1000);
  const year = dateInfo.getFullYear();
  const month = String(dateInfo.getMonth() + 1).padStart(2, '0');
  const day = String(dateInfo.getDate()).padStart(2, '0');
  return year + '-' + month + '-' + day;
}

// 打开更新履历
function openUpdateLog(){
  const content = document.getElementById('updateLogContent');
  let html = '<table class="update-log-table"><thead><tr><th style="width:100px">日期</th><th>修订内容</th><th style="width:80px">编辑人</th></tr></thead><tbody>';
  
  // 按行排序
  const rows = {};
  for(const ref in UPDATE_LOG){
    const m = ref.match(/([A-Z]+)(\d+)/);
    if(m){
      const row = parseInt(m[2]);
      const col = m[1];
      if(!rows[row]) rows[row] = {};
      rows[row][col] = UPDATE_LOG[ref].v;
    }
  }
  
  const sortedRows = Object.keys(rows).sort((a,b)=>parseInt(a)-parseInt(b));
  for(const rowNum of sortedRows){
    const row = rows[rowNum];
    if(rowNum == 1) continue; // 跳过表头
    const date = row.A ? excelDateToDate(row.A) : '';
    const content_text = row.B || '';
    const editor = row.C || '';
    html += '<tr><td>' + date + '</td><td>' + content_text + '</td><td>' + editor + '</td></tr>';
  }
  
  html += '</tbody></table>';
  content.innerHTML = html;
  document.getElementById('updateLogModal').classList.add('active');
}

// 处理文件上传
function handleFileUpload(file){
  if(!file) return;
  
  // 检查文件类型
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext !== 'xlsx' && ext !== 'xls'){
    alert('请上传 .xlsx 或 .xls 格式的Excel文件');
    return;
  }
  
  document.getElementById('uploadFileName').style.display = 'block';
  document.getElementById('uploadFileName').textContent = '已选择文件：' + file.name;
  document.getElementById('progressTip').style.display = 'block';
  document.getElementById('progressTip').textContent = '正在解析Excel文件...';
  
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type:'array'});
      parseAndCompare(workbook);
    }catch(err){
      document.getElementById('progressTip').textContent = '解析失败：' + err.message;
      document.getElementById('progressTip').style.background = '#fff2f0';
      document.getElementById('progressTip').style.borderColor = '#ffccc7';
      document.getElementById('progressTip').style.color = '#cf1322';
    }
  };
  reader.readAsArrayBuffer(file);
}

// 解析Excel并对比数据
function parseAndCompare(workbook){
  document.getElementById('progressTip').textContent = '正在对比数据...';
  
  const newAllData = {};
  const newInputMap = {};
  const newMergeMap = {};
  const summary = [];
  let totalNew = 0, totalUpdated = 0, totalSheets = 0;
  
  workbook.SheetNames.forEach(sheetName => {
    const worksheet = workbook.Sheets[sheetName];
    const sheetData = {};
    const inputs = [];
    const merges = [];
    
    // 解析合并单元格
    if(worksheet['!merges']){
      worksheet['!merges'].forEach(merge => {
        const startCol = numToCol(merge.s.c + 1);
        const startRow = merge.s.r + 1;
        const endCol = numToCol(merge.e.c + 1);
        const endRow = merge.e.r + 1;
        merges.push(startCol + startRow + ':' + endCol + endRow);
      });
    }
    
    // 解析单元格数据
    for(const ref in worksheet){
      if(ref[0] === '!') continue;
      const cell = worksheet[ref];
      let val = '';
      if(cell.t === 's'){
        val = cell.v;
      }else if(cell.t === 'n'){
        val = String(cell.v);
      }else if(cell.t === 'b'){
        val = cell.v ? 'TRUE' : 'FALSE';
      }else if(cell.v !== undefined){
        val = String(cell.v);
      }
      
      if(val !== ''){
        sheetData[ref] = {v: val};
        
        // 识别输入框（橙色背景）
        if(cell.s && cell.s.fgColor && (cell.s.fgColor.rgb === 'FFFFC000' || cell.s.fgColor.rgb === 'FFC000')){
          inputs.push(ref);
        }
      }
    }
    
    newAllData[sheetName] = sheetData;
    if(inputs.length > 0) newInputMap[sheetName] = inputs;
    if(merges.length > 0) newMergeMap[sheetName] = merges;
    
    // 对比数据
    const oldSheetData = ALL_DATA[sheetName] || {};
    let newCount = 0, updatedCount = 0;
    
    for(const ref in sheetData){
      if(!oldSheetData[ref]){
        newCount++;
      }else if(oldSheetData[ref].v !== sheetData[ref].v){
        updatedCount++;
      }
    }
    
    totalNew += newCount;
    totalUpdated += updatedCount;
    totalSheets++;
    
    summary.push({
      sheetName: sheetName,
      oldCount: Object.keys(oldSheetData).length,
      newCount: newCount,
      updatedCount: updatedCount,
      totalCount: Object.keys(sheetData).length,
      status: (newCount > 0 || updatedCount > 0) ? '有更新' : '无变化'
    });
  });
  
  // 保存待更新数据
  pendingUpdate = {
    allData: newAllData,
    inputMap: newInputMap,
    mergeMap: newMergeMap,
    summary: summary
  };
  
  // 显示更新统计
  showUpdateSummary(summary, totalNew, totalUpdated, totalSheets);
  
  document.getElementById('progressTip').textContent = '解析完成！请确认后点击保存';
  document.getElementById('saveBtn').style.display = 'inline-block';
}

// 显示更新统计
function showUpdateSummary(summary, totalNew, totalUpdated, totalSheets){
  const tbody = document.querySelector('#summaryTable tbody');
  tbody.innerHTML = '';
  
  summary.forEach(item => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + item.sheetName + '</td>' +
                   '<td>' + item.oldCount + '</td>' +
                   '<td style="color:#389e0d">' + (item.newCount > 0 ? '+' + item.newCount : '0') + '</td>' +
                   '<td style="color:#fa8c16">' + (item.updatedCount > 0 ? item.updatedCount : '0') + '</td>' +
                   '<td style="color:' + (item.status === '有更新' ? '#389e0d' : '#999') + '">' + item.status + '</td>';
    tbody.appendChild(tr);
  });
  
  document.getElementById('summaryTotal').textContent = 
    '共 ' + totalSheets + ' 个Sheet，新增 ' + totalNew + ' 条数据，更新 ' + totalUpdated + ' 条数据';
  
  document.getElementById('updateSummary').style.display = 'block';
}

<!-- 更新履历弹窗 -->
<div class="modal-overlay" id="updateLogModal">
  <div class="modal">
    <div class="modal-header">
      <h3>更新履历</h3>
      <button class="modal-close" onclick="closeModal('updateLogModal')">&times;</button>
    </div>
    <div class="modal-body" id="updateLogContent"></div>
  </div>
</div>

<!-- 后台维护登录弹窗 -->
<div class="modal-overlay" id="adminLoginModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <h3>后台维护 - 登录</h3>
      <button class="modal-close" onclick="closeModal('adminLoginModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="login-form">
        <div>
          <label>请输入密码</label>
          <input type="password" id="adminPassword" placeholder="请输入密码" onkeypress="if(event.key==='Enter')loginAdmin()">
        </div>
        <div class="login-error" id="loginError">密码错误，请重新输入</div>
        <button class="login-btn" onclick="loginAdmin()">登录</button>
      </div>
    </div>
  </div>
</div>

<!-- 后台维护内容弹窗 -->
<div class="modal-overlay" id="adminModal">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <h3>后台维护 - 数据更新</h3>
      <button class="modal-close" onclick="closeAdminModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('excelFile').click()">
        <div class="upload-icon">&#128196;</div>
        <div class="upload-text">点击或拖拽Excel文件到此处上传</div>
        <div class="upload-hint">支持 .xlsx / .xls 格式，上传后将对比并更新数据</div>
        <input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="handleFileUpload(this.files[0])">
      </div>
      <div class="upload-file-name" id="uploadFileName"></div>
      <div class="progress-tip" id="progressTip"></div>
      <div class="update-summary" id="updateSummary">
        <h4>数据更新统计</h4>
        <table id="summaryTable">
          <thead><tr><th>Sheet名称</th><th>原有数据</th><th>新增数据</th><th>更新数据</th><th>状态</th></tr></thead>
          <tbody></tbody>
        </table>
        <div style="margin-top:12px" class="total" id="summaryTotal"></div>
      </div>
      <div class="attachment-section">
        <h4>附件管理（每个Sheet的DWG/PDF文件）</h4>
        <div class="attachment-list" id="attachmentList"></div>
      </div>
      <div class="admin-actions">
        <button class="btn-cancel" onclick="closeAdminModal()">取消</button>
        <button class="btn-save" id="saveBtn" onclick="saveUpdate()">保存并全覆盖</button>
      </div>
    </div>
  </div>
</div>

<script>
// 页面加载完成后强制渲染附件区域
window.addEventListener('load', function(){
  setTimeout(function(){
    if(typeof renderSheetAttachments === 'function'){
      renderSheetAttachments();
    }
  }, 100);
});
</script>
<script>
// 页面加载完成后自动计算一次
window.addEventListener('load', function(){
  setTimeout(function(){
    if(typeof recalculateFormulas === 'function'){
      recalculateFormulas();
    }
  }, 200);
});
</script>
</body>
