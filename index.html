let currentSheet = 'PL V3落地支架';

function numToCol(n){
  let s='';
  while(n>0){
    let r=(n-1)%26;
    n=Math.floor((n-1)/26);
    s=String.fromCharCode(65+r)+s;
  }
  return s;
}

function buildSheetMergeMap(sheetName){
  const ranges = MERGE_MAP[sheetName] || [];
  const m = {};
  for(const rng of ranges){
    const [start,end] = rng.split(':');
    const startCol = start.match(/[A-Z]+/)[0];
    const startRow = parseInt(start.match(/\d+/)[0]);
    const endCol = end.match(/[A-Z]+/)[0];
    const endRow = parseInt(end.match(/\d+/)[0]);
    const colToNum = (c)=>{let n=0;for(const ch of c)n=n*26+(ch.charCodeAt(0)-64);return n;};
    const startCi = colToNum(startCol);
    const endCi = colToNum(endCol);
    const colspan = endCi - startCi + 1;
    const rowspan = endRow - startRow + 1;
    for(let r=startRow;r<=endRow;r++){
      for(let ci=startCi;ci<=endCi;ci++){
        const key = r+'_'+ci;
        if(r===startRow && ci===startCi){
          m[key] = {merged:false,colspan,rowspan};
        } else {
          m[key] = {merged:true};
        }
      }
    }
  }
  return m;
}

function disp(c){
  if(!c) return '';
  let v = c.v || '';
  return String(v);
}


// ========== 公式自动计算 ==========
function evalExcelFormula(formula, values){
  if(!formula) return '';
  let expr = formula.trim();
  
  // 处理SUM函数（支持范围求和，如SUM(I26:I32)）
  while(expr.includes('SUM(')){
    const idx = expr.indexOf('SUM(');
    let depth = 1;
    let start = idx + 4;
    let endIdx = -1;
    for(let i=start; i<expr.length; i++){
      if(expr[i] === '(') depth++;
      if(expr[i] === ')'){
        depth--;
        if(depth === 0){ endIdx = i; break; }
      }
    }
    if(endIdx > 0){
      const rangeStr = expr.substring(start, endIdx);
      // 检查是否是范围（如I26:I32）
      const rangeMatch = rangeStr.match(/([A-Z]+)(\d+):([A-Z]+)(\d+)/);
      if(rangeMatch){
        const startCol = rangeMatch[1];
        const startRow = parseInt(rangeMatch[2]);
        const endCol = rangeMatch[3];
        const endRow = parseInt(rangeMatch[4]);
        let sum = 0;
        const colToNum = (c)=>{let n=0;for(const ch of c)n=n*26+(ch.charCodeAt(0)-64);return n;};
        const numToCol = (n)=>{let s='';while(n>0){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26);}return s;};
        const sc = colToNum(startCol);
        const ec = colToNum(endCol);
        for(let r=startRow; r<=endRow; r++){
          for(let c=sc; c<=ec; c++){
            const ref = numToCol(c) + r;
            if(values[ref] !== undefined && !isNaN(parseFloat(values[ref]))){
              sum += parseFloat(values[ref]);
            }
          }
        }
        expr = expr.substring(0, idx) + '(' + sum + ')' + expr.substring(endIdx+1);
      } else {
        // 不是范围，直接替换为0（或尝试简单求和）
        expr = expr.substring(0, idx) + '0' + expr.substring(endIdx+1);
      }
    } else break;
  }
  // 替换单元格引用为值
  const refs = [];
  expr = expr.replace(/([A-Z]+)(\d+)/g, function(match, col, row){
    const ref = col + row;
    refs.push(ref);
    return '___REF_' + refs.length + '___';
  });
  
  for(let i=0; i<refs.length; i++){
    const ref = refs[i];
    let val = 0;
    if(values[ref] !== undefined && values[ref] !== '' && !isNaN(parseFloat(values[ref]))){
      val = parseFloat(values[ref]);
    }
    expr = expr.replace('___REF_' + (i+1) + '___', val);
  }
  
  // 处理CEILING函数：CEILING(number, significance) = Math.ceil(number/significance)*significance
  while(expr.includes('CEILING(')){
    const idx = expr.indexOf('CEILING(');
    let depth = 1;
    let start = idx + 8;
    let commaIdx = -1;
    let endIdx = -1;
    for(let i=start; i<expr.length; i++){
      if(expr[i] === '(') depth++;
      if(expr[i] === ')'){
        depth--;
        if(depth === 0){ endIdx = i; break; }
      }
      if(expr[i] === ',' && depth === 1 && commaIdx === -1) commaIdx = i;
    }
    if(commaIdx > 0 && endIdx > 0){
      const num = expr.substring(start, commaIdx);
      const sig = expr.substring(commaIdx+1, endIdx);
      expr = expr.substring(0, idx) + '(Math.ceil((' + num + ')/(' + sig + '))*(' + sig + '))' + expr.substring(endIdx+1);
    } else break;
  }
  
  // 处理FLOOR函数：FLOOR(number, significance) = Math.floor(number/significance)*significance
  while(expr.includes('FLOOR(')){
    const idx = expr.indexOf('FLOOR(');
    let depth = 1;
    let start = idx + 6;
    let commaIdx = -1;
    let endIdx = -1;
    for(let i=start; i<expr.length; i++){
      if(expr[i] === '(') depth++;
      if(expr[i] === ')'){
        depth--;
        if(depth === 0){ endIdx = i; break; }
      }
      if(expr[i] === ',' && depth === 1 && commaIdx === -1) commaIdx = i;
    }
    if(commaIdx > 0 && endIdx > 0){
      const num = expr.substring(start, commaIdx);
      const sig = expr.substring(commaIdx+1, endIdx);
      expr = expr.substring(0, idx) + '(Math.floor((' + num + ')/(' + sig + '))*(' + sig + '))' + expr.substring(endIdx+1);
    } else break;
  }
  
  // 处理INT函数：INT(number) = Math.floor(number)
  expr = expr.replace(/INT\(/g, 'Math.floor(');
  
  // 替换Excel函数
  expr = expr.replace(/ROUNDDOWN\(/g, 'Math.floor(');
  expr = expr.replace(/ROUNDUP\(/g, 'Math.ceil(');
  expr = expr.replace(/ROUND\(/g, 'Math.round(');
  expr = expr.replace(/MAX\(/g, 'Math.max(');
  expr = expr.replace(/<>/g, '!=');
  
  // 替换Excel的=比较为JavaScript的==（但不替换<=, >=, !=）
  expr = expr.replace(/([^<>!=])=([^=])/g, '$1==$2');
  expr = expr.replace(/^=([^=])/, '==$1');
  
  // 处理MOD函数
  while(expr.includes('MOD(')){
    const idx = expr.indexOf('MOD(');
    let depth = 1;
    let start = idx + 4;
    let commaIdx = -1;
    let endIdx = -1;
    for(let i=start; i<expr.length; i++){
      if(expr[i] === '(') depth++;
      if(expr[i] === ')'){
        depth--;
        if(depth === 0){ endIdx = i; break; }
      }
      if(expr[i] === ',' && depth === 1 && commaIdx === -1) commaIdx = i;
    }
    if(commaIdx > 0 && endIdx > 0){
      const a = expr.substring(start, commaIdx);
      const b = expr.substring(commaIdx+1, endIdx);
      expr = expr.substring(0, idx) + '((' + a + ')%(' + b + '))' + expr.substring(endIdx+1);
    } else break;
  }
  
  // 处理OR函数
  while(expr.includes('OR(')){
    const idx = expr.indexOf('OR(');
    let depth = 1;
    let start = idx + 3;
    let endIdx = -1;
    for(let i=start; i<expr.length; i++){
      if(expr[i] === '(') depth++;
      if(expr[i] === ')'){
        depth--;
        if(depth === 0){ endIdx = i; break; }
      }
    }
    if(endIdx > 0){
      const args = expr.substring(start, endIdx);
      expr = expr.substring(0, idx) + '((' + args.replace(/,/g, ')||(') + '))' + expr.substring(endIdx+1);
    } else break;
  }
  
  // 处理AND函数
  while(expr.includes('AND(')){
    const idx = expr.indexOf('AND(');
    let depth = 1;
    let start = idx + 4;
    let endIdx = -1;
    for(let i=start; i<expr.length; i++){
      if(expr[i] === '(') depth++;
      if(expr[i] === ')'){
        depth--;
        if(depth === 0){ endIdx = i; break; }
      }
    }
    if(endIdx > 0){
      const args = expr.substring(start, endIdx);
      expr = expr.substring(0, idx) + '((' + args.replace(/,/g, ')&&(') + '))' + expr.substring(endIdx+1);
    } else break;
  }
  
  // 处理IFERROR函数：IFERROR(value, value_if_error)
  while(expr.includes('IFERROR(')){
    const idx = expr.indexOf('IFERROR(');
    let depth = 1;
    let start = idx + 8;
    let commaIdx = -1;
    let endIdx = -1;
    for(let i=start; i<expr.length; i++){
      if(expr[i] === '(') depth++;
      if(expr[i] === ')'){
        depth--;
        if(depth === 0){ endIdx = i; break; }
      }
      if(expr[i] === ',' && depth === 1 && commaIdx === -1) commaIdx = i;
    }
    if(commaIdx > 0 && endIdx > 0){
      const val = expr.substring(start, commaIdx);
      const errVal = expr.substring(commaIdx+1, endIdx);
      expr = expr.substring(0, idx) + '(function(){try{return (' + val + ');}catch(e){return (' + errVal + ');}})()' + expr.substring(endIdx+1);
    } else break;
  }
  
  // 处理IF函数
  let maxIter = 20;
  while(expr.includes('IF(') && maxIter-- > 0){
    const idx = expr.indexOf('IF(');
    let depth = 1;
    let start = idx + 3;
    let comma1 = -1;
    let comma2 = -1;
    let endIdx = -1;
    for(let i=start; i<expr.length; i++){
      if(expr[i] === '(') depth++;
      if(expr[i] === ')'){
        depth--;
        if(depth === 0){ endIdx = i; break; }
      }
      if(expr[i] === ',' && depth === 1){
        if(comma1 === -1) comma1 = i;
        else if(comma2 === -1) comma2 = i;
      }
    }
    if(comma1 > 0 && comma2 > 0 && endIdx > 0){
      const cond = expr.substring(start, comma1);
      const trueVal = expr.substring(comma1+1, comma2);
      const falseVal = expr.substring(comma2+1, endIdx);
      expr = expr.substring(0, idx) + '((' + cond + ')?(' + trueVal + '):(' + falseVal + '))' + expr.substring(endIdx+1);
    } else break;
  }
  
  
  
  try {
    const result = eval(expr);
    if(typeof result === 'number' && !isNaN(result) && isFinite(result)){
      return Math.round(result * 1000) / 1000;
    }
    return result;
  } catch(e) {
    console.error('公式计算错误:', formula, expr, e.message);
    return '';
  }
}

function recalculateFormulas(){
  const sheetData = ALL_DATA[currentSheet];
  if(!sheetData) return;
  
  const values = {};
  
  for(const ref in sheetData){
    const cell = sheetData[ref];
    if(cell && !cell.f && cell.v !== '' && !isNaN(parseFloat(cell.v))){
      values[ref] = parseFloat(cell.v);
    }
  }
  
  document.querySelectorAll('input[data-ref]').forEach(input => {
    const ref = input.getAttribute('data-ref');
    if(input.value !== '' && !isNaN(parseFloat(input.value))){
      values[ref] = parseFloat(input.value);
    }
  });
  
  for(let iter=0; iter<15; iter++){
    let changed = false;
    for(const ref in sheetData){
      const cell = sheetData[ref];
      if(cell && cell.f){
        const result = evalExcelFormula(cell.f, values);
        if(result !== '' && result !== values[ref]){
          values[ref] = result;
          changed = true;
        }
      }
    }
    if(!changed) break;
  }
  
  document.querySelectorAll('td[data-formula-ref]').forEach(td => {
    const ref = td.getAttribute('data-formula-ref');
    if(values[ref] !== undefined){
      td.textContent = values[ref];
    }
  });
}

// ========== 输入区重置（当前sheet所有输入框归0） ==========
function resetSheetInput(){
  document.querySelectorAll('#tableContainer input[data-ref]').forEach(input => {
    input.value = 0;
  });
  recalculateFormulas();
}

// ========== 数据驱动列宽 ==========
// 依据每张表的表头语义为每列分配合理列宽，生成 <colgroup>，替换写死的固定列宽模式。
var COL_HEADER_KW = {
  name:  /组件名称|Components|航空箱名称|序号|规格|Frame|框架|箱体|屏体/,
  qty:   /数量|Quantity|总数|Total|装箱|配棉|pcs|PCS/,
  sap:   /SAP|料号|NO\.|No\.|物料编号/,
  desc:  /物料描述|Material Description|珍珠棉|说明|备注|Resolution|分辨率/,
  logic: /计算逻辑|Calculation Logic|配置|Configuration|公式|Frame|框架/,
  weight:/重量|Weight|Wight|KG|kg/
};
function colTypeByHeader(h){
  if(!h) return 'other';
  var s = String(h).trim();
  if(COL_HEADER_KW.name.test(s)) return 'name';
  if(COL_HEADER_KW.sap.test(s)) return 'sap';
  if(COL_HEADER_KW.weight.test(s)) return 'weight';
  if(COL_HEADER_KW.qty.test(s)) return 'qty';
  if(COL_HEADER_KW.desc.test(s)) return 'desc';
  if(COL_HEADER_KW.logic.test(s)) return 'logic';
  return 'other';
}
// 每种列类型的保底宽度(px)——仅在内容估算过小时兜底；实际以内容为准
var COL_BASE_WIDTH = { name:150, qty:72, sap:110, desc:190, logic:210, weight:72, other:110 };
// 把"中文 英文"混合表头拆成两行显示：中文一行、英文一行（表头最多2行，不挤成一坨）。
// 只用于表头单元格；对纯中文/纯英文/无中英混合的文本原样返回。
function splitCNEN(txt){
  if(!txt) return '';
  txt = String(txt);
  // 源数据若已自带分行(中英文各一行，如"大箱体宽度\nWidth of big panel")，直接按原换行保留，
  // 避免再按"最后一个中文字符"切分导致全角括号等中文后缀标点被误归到英文行开头。
  if(/\r?\n/.test(txt)){
    return txt.split(/\r?\n/).map(function(l){ return l.replace(/\s+/g,' ').trim(); }).filter(Boolean).join('\n');
  }
  if(!/[\u4e00-\u9fff]/.test(txt) || !/[A-Za-z0-9]/.test(txt)) return txt; // 须中英混合
  var cn = (txt.match(/[\u4e00-\u9fff]+/g)||[]).join('');                   // 中文块
  var lastCj = -1;
  for(var i=0;i<txt.length;i++){ if(/[\u4e00-\u9fff]/.test(txt[i])) lastCj=i; }
  // 英文部分 = 最后一个中文字符之后的内容，并【去掉原行里的换行符】。
  // 这样"高度Height\n（500*500mm）"会被拆成"高度\nHeight（500*500mm）"两行，而不是因为原 \n 变成3段。
  var en = lastCj>=0 ? txt.slice(lastCj+1).replace(/\r?\n/g,'').trim() : ''; // 最后一个中文字符之后的英文
  if(!cn) return txt;   // 无中文
  if(!en) return txt;   // 无英文（尾部无英文），不动，避免误拆纯中文/逻辑说明
  return cn + '\n' + en; // 中文一行、英文一行（用 \n 分隔，渲染时转为 <br>）
}
// 估算一段文本在 12px 字体下的像素宽度（中文≈13px、英文数字≈6.5px、空格≈3px）
function segWidthPx(txt){
  var w=0; txt=String(txt);
  for(var i=0;i<txt.length;i++){
    var c=txt[i];
    if(/[\u4e00-\u9fff]/.test(c)) w+=13;
    else if(c===' ') w+=3;
    else if(c.codePointAt(0) > 0xFF) w+=12; // 全角字符（全角括号（）【】、假名、全角标点等）约占一个全角宽度
    else w+=6.5;
  }
  return w;
}
// 取一段文本中"最宽的连续不可断片段"（空白分词），用于长文本列宽的估算
function maxTokenPx(txt){
  var toks = String(txt).split(/[\s]+/), mx=0;
  for(var i=0;i<toks.length;i++){ var w=segWidthPx(toks[i]); if(w>mx) mx=w; }
  return mx;
}
// 找到一张表里最值得作为"列语义参考"的表头行（含最多关键词的那行）
function getHeaderRowForTable(table){
  var rows = table.querySelectorAll('tr');
  var bestRow = null, bestScore = -1;
  for(var k=0;k<rows.length;k++){
    var cells = rows[k].children;
    var cls = (rows[k].className||'').toString();
    var isInputHdr = cls.indexOf('input-header') >= 0;
    var score = 0;
    // ★输入区表头行（宽度/高度/组件名称/数量…）本身就是一张表的表头，应优先作为列语义/宽度参考。
    // 否则像表0这种"宽度/高度"输入区，只会按"请在左侧输入箱体排列"(行1)而错判，导致高度列宽不足超行。
    if(isInputHdr) score += 100;
    for(var ci=0; ci<cells.length; ci++){
      var txt = (cells[ci]&&cells[ci].textContent||'').trim();
      if(txt && (COL_HEADER_KW.name.test(txt)||COL_HEADER_KW.sap.test(txt)||COL_HEADER_KW.desc.test(txt)||COL_HEADER_KW.logic.test(txt)||COL_HEADER_KW.weight.test(txt))) score++;
      // 输入区表头词（宽度/高度/排列方式/间距等）额外计分，让"宽度/高度"这类输入区作为表头被识别
      if(isInputHdr && txt && /宽度|高度|Width|Height|排列|Arrangement|间距|Pin|Distance/.test(txt)) score++;
    }
    if(score>bestScore){ bestScore=score; bestRow=rows[k]; }
  }
  return bestScore>0 ? bestRow : null;
}
// 依据表头语义判断该列应统一的水平对齐方式：
//   物料描述/计算逻辑这类长文本列 → left；组件名称/数量/SAP料号/重量/配棉/装箱这类数据列 → center；
//   无法判定则返回 ''（保留 Excel 原始对齐）。
function colAlignFromHeader(h){
  h = String(h||'');
  if(/物料描述|Material Description|珍珠棉|计算逻辑|Calculation Logic|配置|Configuration|备注|说明/.test(h)) return 'left';
  if(/组件名称|Components|航空箱名称|数量|Quantity|总数|Total|SAP|料号|NO\.|No\.|重量|Weight|Wight|配棉|装箱|KG/.test(h)) return 'center';
  return '';
}
// 【按列对齐】强制同一列所有数据单元格使用统一对齐，避免同一列内有左有中导致参差不齐。
// 每张表根据自己的表头语义定列对齐：SAP料号列全居中、计算逻辑列全居左、物料描述列全居左、数量/重量列全居中。
// 只作用于"表头行下方"的数据单元格（colspan===1），不改变表头/标题/输入区/备注行的对齐。
function applyColumnAlignment(table){
  var headerRow = getHeaderRowForTable(table);
  if(!headerRow) return;
  var rows = Array.prototype.slice.call(table.rows);
  var headerIdx = rows.indexOf(headerRow);
  if(headerIdx < 0) return;
  // 把表头行按 colspan 展开，得到每个真实列的对齐
  var colAligns = []; // colAligns[realCol] = 'left'|'center'|'right'|''
  var pos = 0;
  Array.prototype.forEach.call(headerRow.children, function(td){
    var cs = parseInt(td.getAttribute('colspan'))||1;
    var txt = (td.textContent||'').trim();
    var align = colAlignFromHeader(txt);
    for(var k=0;k<cs;k++){ colAligns[pos+k] = align; }
    pos += cs;
  });
  var maxPos = pos; // 表头行展开后的真实列数
  // ★rowspan 感知：用"每列被上方rowspan占用的剩余行数"追踪每个 td 的真实列位置。
  // 因为带 rowspan 的行（如方式2表里 A/B/E 列被 rowspan=7/8 占住），其后续行只有部分 td，
  // 若只按 colspan 累加会错位（把装箱数量列的对齐误应用到配棉数量列，导致个别没居中）。
  var colBlocked = []; // colBlocked[realCol] = 该列剩余被上方rowspan占用的行数(不含当前行)
  for(var ri = headerIdx+1; ri < rows.length; ri++){
    var tr = rows[ri];
    // 跳过标题行/备注行/输入行（这些不是普通数据，保留原对齐）
    var rowTxt = (tr.textContent||'').replace(/\s+/g,'');
    if(!rowTxt) continue;
    if(tr.className.indexOf && (tr.className.indexOf('note-row')>=0 || tr.className.indexOf('input-header')>=0 || tr.className.indexOf('input-row')>=0 || tr.className.indexOf('section-header')>=0)) continue;
    var p = 0;
    for(var t=0; t<tr.children.length; t++){
      var td = tr.children[t];
      // 前进到第一个未被上方rowspan占用的列（被占的列本行没有td）
      while(colBlocked[p] && p < maxPos + 8){ p++; }
      var cs = parseInt(td.getAttribute('colspan'))||1;
      var rs = parseInt(td.getAttribute('rowspan'))||1;
      if(cs === 1){
        var align = colAligns[p];
        if(align){
          // 用 !important 内联覆盖 CSS 的 td:nth-child 强制居中规则，确保整列真正保持一致
          td.style.setProperty('text-align', align, 'important');
          // 移除会与本列对齐冲突的"长文本居左/数字居中"类
          if(align === 'center'){ td.classList.remove('desc-cell','pearl-cotton-desc','left-align-text'); }
          else if(align === 'left'){ td.classList.remove('num-cell','cell-qty','cell-weight'); }
        }
      }
      // 登记本 td 覆盖列对后续行的 rowspan 占用
      if(rs > 1){
        for(var k=0;k<cs;k++){ colBlocked[p+k] = Math.max(colBlocked[p+k]||0, rs); }
      }
      p += cs;
    }
    // 该行处理完：所有被占列的剩余行数减1（下一行占用少1行）
    for(var c=0;c<maxPos;c++){ if(colBlocked[c]) colBlocked[c]--; }
  }
}
function applySmartColumnWidths(table){
  // 移除旧的 colgroup，避免重复叠加
  var old = table.querySelector('colgroup');
  if(old) old.parentNode.removeChild(old);
  // 计算真实列数：累加每行单元格的 colspan（合并单元格会跨多列，td 个数≠真实列数）
  var rows = table.querySelectorAll('tr');
  var totalCols = 0;
  for(var i=0; i<rows.length; i++){
    var sum = 0;
    Array.prototype.forEach.call(rows[i].children, function(td){ sum += (parseInt(td.getAttribute('colspan'))||1); });
    if(sum > totalCols) totalCols = sum;
  }
  if(totalCols===0) return;
  // ★防止"整行备注/标题跨列合并"把 colgroup 撑出多余空列：
  //   表头行的 colspan 总和 = 表格的真实列数。若某行的 colspan 总和(如备注行 A27:J27 的 colspan=10)
  //   超过表头列数(实际只有9列)，说明该合并只为了把长文本横向铺开，会多出一个被孤立的列，
  //   导致方式2表右侧留下 138px 空白。这里把 totalCols 封顶到表头列数，消除多余空列。
  var hdrRow = getHeaderRowForTable(table);
  if(hdrRow){
    var hdrSum = 0;
    Array.prototype.forEach.call(hdrRow.children, function(td){ hdrSum += (parseInt(td.getAttribute('colspan'))||1); });
    if(hdrSum > 0 && totalCols > hdrSum) totalCols = hdrSum;
  }

  // 把"最像表头"那一行的单元格，按 colspan 展开到每一个真实列上，
  // 使每个真实列都能拿到自己的表头语义（避免 colspan 导致列语义错位）。
  var headerRow = getHeaderRowForTable(table);
  var realHeadTxt = []; // realHeadTxt[ci] = 第 ci 真实列的表头文本
  var realHeadColspan = []; // 记录该真实列是否属于某个合并表头
  for(var ci=0; ci<totalCols; ci++){ realHeadTxt[ci]=''; realHeadColspan[ci]=false; }
  if(headerRow){
    var pos = 0;
    Array.prototype.forEach.call(headerRow.children, function(td){
      var cs = parseInt(td.getAttribute('colspan'))||1;
      var txt = (td.textContent||'').trim();
      for(var k=0; k<Math.min(cs,totalCols-pos); k++){
        realHeadTxt[pos+k] = txt;
        realHeadColspan[pos+k] = (cs>1);
      }
      pos += cs;
    });
  }

  // 【关键】为每个真实列按【实际内容】估算宽度，而不是套用固定值。
  // 每张表用自己的内容决定列宽——有的列该宽则宽（长描述/逻辑），该窄则窄（数量/SAP/重量）。
  // 宽度 = max( 表头拆两行后的较宽一行 , 该列最长内容估算 )，再夹在稳妥区间内，最后归一化为百分比。
  var colTypes = [];
  var colWidths = []; // 各真实列的原始估算宽度(px)
  var colMins = [];   // 各真实列的最小宽度(px)
  var colCaps = [];   // 各真实列的最大宽度(px)
  var colHead = [];   // 各真实列表头所需的宽度(px)，保证表头最多2行
  for(var ci2=0; ci2<totalCols; ci2++){
    var headTxt = realHeadTxt[ci2];
    var type = colTypeByHeader(headTxt);
    colTypes.push(type);
    if(isColumnEmpty(table, ci2)){
      // 空列：给极小权重，使其几乎不占空间（但不为0，避免 fixed 布局下列崩挤）
      colWidths.push(0.6);
      colMins.push(6);
      colCaps.push(10);
      colHead.push(0);
      continue;
    }
    // 表头宽度：拆中英文两行后，取较宽的一行（英文通常更宽）
    var headW = 0;
    if(headTxt && headTxt.trim()){
      var hcntxt = headTxt;
      var cnPart = (hcntxt.match(/[\u4e00-\u9fff]+/g)||[]).join('');
      var lc = -1;
      for(var ii=0;ii<hcntxt.length;ii++){ if(/[\u4e00-\u9fff]/.test(hcntxt[ii])) lc=ii; }
      var enPart = lc>=0 ? hcntxt.slice(lc+1) : '';
      headW = Math.max(segWidthPx(cnPart), segWidthPx(enPart));
      if(!headW) headW = segWidthPx(cnPart||hcntxt);
      headW += 8; // 微余量
    }
    // 数据宽度：遍历该列所有单元格，短的按整行宽、长文本按最宽连续片段
    var dataW = 0;
    Array.prototype.forEach.call(table.rows, function(tr){
      var p = 0;
      Array.prototype.forEach.call(tr.children, function(td){
        var cs = parseInt(td.getAttribute('colspan'))||1;
        if(ci2 >= p && ci2 < p+cs){
          var dtxt = (td.textContent||'').replace(/\s+/g,' ').trim();
          if(dtxt){
            var full = segWidthPx(dtxt);
            var tok  = maxTokenPx(dtxt);
            var need = (full <= tok*1.8) ? full : tok; // 短文本按满宽，长文本按最宽token（允许换行）
            if(need > dataW) dataW = need;
          }
        }
        p += cs;
      });
    });
    // 合并跨列表头（物料描述/计算逻辑跨多列）适度加宽
    dataW = Math.max(dataW, realHeadColspan[ci2] ? 40 : 0);
    // 内容为主，兼顾列类型保底 —— 确保窄列（数量/SAP/重量）不会过分挤压，同时不超宽
    var need = Math.max(headW, dataW, 56);
    // 每种列类型的【最小宽度】——窄列必须保住，长文本列可压（靠换行）
    var minPx = { name:110, qty:60, sap:135, desc:90, logic:100, weight:78, other:72 }[type] || 72;
    // 每种列类型的【期望上限】——避免逻辑/描述列被极长单词/文本撑爆
    var cap = { name:250, qty:110, sap:165, desc:280, logic:320, weight:120, other:200 }[type] || 240;
    if(realHeadColspan[ci2] && (type==='desc'||type==='logic')) cap = Math.max(cap, 260); // 多列合并的长文本列给更宽空间
    need = Math.max(need, minPx);
    need = Math.min(need, cap);
    colWidths.push(need);
    // 该列表头所需的宽度（保证表头最多2行：中文一行英文一行各自能放下）。
    // 上限170px，避免单列表头过宽挤占其他列。
    colHead.push(Math.min(headW || 0, 170));
    colMins.push(minPx);
    colCaps.push(cap);
  }

  // 【关键】按容器实际可用宽度分配像素宽（各列真实px相加 = 容器宽，铺满无滚动条）。
  // 优先保住窄列（SAP/数量/重量/名称），空间不足时优先压缩可换行的长文本列（描述/逻辑），
  // 这样每张表按自己内容得到合理宽窄，不会出现"有的太宽有的太窄"。
  var avail = getTableAvailableWidth(table);
  if(avail <= 0) avail = document.documentElement.clientWidth || 1200;
  var alloc = colWidths.slice();
  // 每个列的"不可再压缩下限" = max(类型最小宽度, 该列表头所需宽度) —— 保证表头最多2行不因压缩而换行超2行
  var floors = [];
  for(var a=0; a<alloc.length; a++){ floors.push(Math.max(colMins[a], colHead[a] || 0)); }
  var total = 0;
  for(var a=0; a<alloc.length; a++) total += alloc[a];
  if(total > avail){
    // 需要压缩：优先压缩【最右边的列】，且每列最多压到其 floor（表头仍能2行显示）。
    // 这样"左边位置不够"时，把右边列调小，给左边列腾出空间。
    var rounds = 0;
    while(total > avail && rounds < 40){
      var deficit = total - avail;
      var shrunkThisRound = false;
      // 从右往左，依次把能压缩的列压向 floor
      for(var a2 = alloc.length-1; a2 >= 0; a2--){
        if(total <= avail) break;
        var room = alloc[a2] - floors[a2];
        if(room <= 0) continue; // 没得压
        // 优先多压右侧列：取剩余缺口与该列可压缩空间的较小者，但右侧列可稍多让一点
        var cut = Math.min(room, Math.max(deficit * 0.5, room * 0.35) );
        cut = Math.min(room, deficit);
        alloc[a2] -= cut;
        total -= cut;
        shrunkThisRound = true;
      }
      if(!shrunkThisRound) break;
      rounds++;
    }
    // 若仍超（所有列都压到 floor 还不够），再对所有列等比削减（硬下限40px）
    if(total > avail){
      var hardMin = 40;
      var guard=0;
      while(total > avail && guard < 40){
        var d2 = total - avail;
        var totRoom = 0;
        for(var a6=0; a6<alloc.length; a6++){ if(alloc[a6] > hardMin) totRoom += (alloc[a6]-hardMin); }
        if(totRoom<=0){ break; }
        for(var a7=0; a7<alloc.length; a7++){
          if(alloc[a7] > hardMin){
            var room2 = alloc[a7]-hardMin;
            alloc[a7] -= Math.min(room2, d2*(room2/totRoom));
          }
        }
        total = 0; for(var a8=0; a8<alloc.length; a8++) total += alloc[a8];
        guard++;
      }
    }
  } else if(total < avail){
    // 空间富余：按各列"需求比例"等比放大，使表格铺满容器、无右侧空白，
    // 且不把任何一列单独撑得过宽（保持各列相对宽窄关系）。
    var extra = avail - total;
    var growSum = 0;
    for(var g=0; g<alloc.length; g++) growSum += alloc[g];
    if(growSum <= 0){ alloc[0] += extra; }
    else {
      for(var g3=0; g3<alloc.length; g3++){
        alloc[g3] += extra * (alloc[g3]/growSum);
      }
    }
    total = 0; for(var g4=0; g4<alloc.length; g4++) total += alloc[g4];
  }

  var colgroup = document.createElement('colgroup');
  for(var ci3=0; ci3<totalCols; ci3++){
    var col = document.createElement('col');
    col.className = 'col-'+colTypes[ci3];
    col.style.width = Math.max(0, alloc[ci3]).toFixed(1) + 'px';
    colgroup.appendChild(col);
  }
  if(table.firstChild) table.insertBefore(colgroup, table.firstChild);
  else table.appendChild(colgroup);
}
// 获取表格所在容器的可用宽度（用于列宽等比缩放铺满）
function getTableAvailableWidth(table){
  var wrap = table.parentElement;
  while(wrap){
    var cls = (typeof wrap.className==='string')?wrap.className:(wrap.className.baseVal||'');
    if(cls.indexOf('table-wrapper')>=0) break;
    wrap = wrap.parentElement;
  }
  if(wrap && wrap.clientWidth>0) return wrap.clientWidth;
  return document.documentElement.clientWidth;
}
// 把某行的单元格按 colspan 展开成一个数组（长度为真实列数），返回第 realCol 列对应 td 的文本
function cellAtRealCol(tr, realCol){
  var pos = 0;
  var result = '';
  Array.prototype.forEach.call(tr.children, function(td){
    var cs = parseInt(td.getAttribute('colspan'))||1;
    if(realCol >= pos && realCol < pos+cs){ result = (td.textContent||'').replace(/\s+/g,'').length ? td.textContent : ''; }
    pos += cs;
  });
  return result;
}
// 判断某真实列在整张表内是否所有单元格都为空（用于收缩空列）
function isColumnEmpty(table, colIndex){
  var empty = true;
  Array.prototype.forEach.call(table.rows, function(tr){
    var pos = 0;
    Array.prototype.forEach.call(tr.children, function(td){
      var cs = parseInt(td.getAttribute('colspan'))||1;
      if(colIndex >= pos && colIndex < pos+cs){
        if((td.textContent||'').replace(/\s+/g,'')!=='') empty = false;
      }
      pos += cs;
    });
  });
  return empty;
}
// 按给定真实列的最长内容估算合理列宽(px)；同时考虑换行，限制在 90~320px 之间
function estimateColWidth(table, colIndex){
  var maxLen = 0, charsSum = 0, rowsCount = 0;
  Array.prototype.forEach.call(table.rows, function(tr){
    var pos = 0;
    Array.prototype.forEach.call(tr.children, function(td){
      var cs = parseInt(td.getAttribute('colspan'))||1;
      if(colIndex >= pos && colIndex < pos+cs){
        var txt = ((td.textContent||'').replace(/\s+/g,'')).length;
        if(txt>maxLen) maxLen = txt;
        charsSum += txt; rowsCount++;
      }
      pos += cs;
    });
  });
  // 平均每行字符数决定宽度；中文按2字符宽估算
  var avg = rowsCount>0 ? charsSum/rowsCount : maxLen;
  var est = avg*16 + 40;
  return Math.max(90, Math.min(320, Math.round(est)));
}

function renderTable(){
  const sheetData = ALL_DATA[currentSheet] || {};
  const inputs = INPUT_MAP[currentSheet] || [];
  const sheetMergeMap = buildSheetMergeMap(currentSheet);

  // 向上找"本列表头"：依赖下方预扫描出的表头行集合 headerRows，只在表头行里取值，避免数据文本偶然含关键词被误判、也不跨表格
  const HEADER_KW = ['组件名称','Components','数量','Quantity','总数','SAP','重量','Weight','配棉','装箱',
    '物料描述','Material Description','珍珠棉','计算逻辑','Calculation Logic','航空箱名称','配置','Configuration',
    '宽度','Width','高度','Height'];
  function findColHeader(col, rNum){
    for(let hr=rNum; hr>=1; hr--){
      if(headerRows.has(hr)){
        const hv = String((sheetData[col+hr]||{}).v||'');
        if(hv.trim()!=='') return hv; // 该表头行此列有值就用它；为空（可能合并）则继续向上找
      }
    }
    return String((sheetData[col+rNum]||{}).v||'');
  }
  
  // 计算最大行和最大列
  let maxRow = 0;
  let maxCol = 9;
  for(const ref in sheetData){
    const m = ref.match(/([A-Z]+)(\d+)/);
    if(m){
      const row = parseInt(m[2]);
      if(row > maxRow) maxRow = row;
    }
  }
  // 计算"真正有独立内容"的最大列（排除仅作为横向合并延续列的空列）
  // 说明：像 A27:J27 这种把备注文本横跨铺开的整行合并，其结束列（J）本身并没有
  // 独立数据/输入框，只是为了让长文本跨列显示。若据此把 maxCol 撑到 J，会让表格
  // 每一行右侧都多出一个空白列。因此这里先统计真实数据列，再据此决定合并能否扩展。
  const colToNum = (c)=>{let n=0;for(const ch of c)n=n*26+(ch.charCodeAt(0)-64);return n;};
  let dataMaxCol = 0;
  // 区间内被横向合并"吞并"的延续列（非合并起始列）不应被视为独立内容列
  const mergedAway = new Set();
  for(const rng of (MERGE_MAP[currentSheet]||[])){
    const [start,end] = rng.split(':');
    const sc = start.match(/[A-Z]+/)[0], sr = parseInt(start.match(/\d+/)[0]);
    const ec = end.match(/[A-Z]+/)[0], er = parseInt(end.match(/\d+/)[0]);
    const sNum = colToNum(sc), eNum = colToNum(ec);
    if(eNum > sNum){ // 横向合并：结束列比起始列大
      for(let r=sr; r<=er; r++){
        for(let ci=sNum+1; ci<=eNum; ci++){ // 除起始列外都是被吞并的延续列
          mergedAway.add(r+'_'+ci);
        }
      }
    }
  }
  for(const ref in sheetData){
    const m = ref.match(/([A-Z]+)(\d+)/);
    if(!m) continue;
    const colLet = m[1], rowNum = parseInt(m[2]);
    const cNum = colToNum(colLet);
    const cell = sheetData[ref];
    const hasVal = cell && cell.v !== undefined && String(cell.v).trim() !== '';
    const isInput = inputs.includes(ref);
    // 只要该单元格有值或是输入框，且不是横向合并的延续列，就算作真实数据列
    if((hasVal || isInput) && !mergedAway.has(rowNum+'_'+cNum)){
      if(cNum > dataMaxCol) dataMaxCol = cNum;
    }
  }
  // 合并单元格扩展maxCol：仅当合并结束列 <= 真实数据最大列时才允许扩展，
  // 避免备注/标题跨列合并（如 A27:J27）把表格右侧撑出一个空列
  for(const rng of (MERGE_MAP[currentSheet]||[])){
    const end = rng.split(':')[1];
    const endCol = end.match(/[A-Z]+/)[0];
    if(colToNum(endCol) <= dataMaxCol) {
      if(colToNum(endCol) > maxCol) maxCol = colToNum(endCol);
    }
  }
  // 兜底：真实数据列可能超过默认9，或某些表格确实需要合并结束列，取两者更大值
  if(dataMaxCol > maxCol) maxCol = dataMaxCol;
  
  // 计算最小起始列（去掉左边空白列）
  let minCol = 1;
  for(let ci=1; ci<=maxCol; ci++){
    let colHasContent = false;
    for(let rNum=1; rNum<=maxRow; rNum++){
      const col = numToCol(ci);
      const ref = col + rNum;
      const c = sheetData[ref];
      if(c && c.v && c.v.trim() !== ''){
        colHasContent = true;
        break;
      }
    }
    if(colHasContent){
      minCol = ci;
      break;
    }
  }

  // 预扫描"表头行"：一行中有>=2个【短文本(≤30字符)且命中表头关键词】的单元格，即认定为表头行（用于findColHeader定位本列表头）
  const headerRows = new Set();
  for(let rr=1; rr<=maxRow; rr++){
    let hit=0;
    for(let cc=1; cc<=maxCol; cc++){
      const hcol = numToCol(cc);
      const cv = String((sheetData[hcol+rr]||{}).v||'');
      if(cv.trim()!=='' && cv.length<=30 && HEADER_KW.some(k=>cv.includes(k))) hit++;
    }
    if(hit>=2) headerRows.add(rr);
  }
  
  const container = document.getElementById('tableContainer');
  let html = '';
  let inSection = false;
  let currentTableClass = '';
  
  for(let rNum=1; rNum<=maxRow; rNum++){
    const rowCells = {};
    for(let ci=minCol; ci<=maxCol; ci++){
      const col = numToCol(ci);
      const ref = col + rNum;
      rowCells[ref] = sheetData[ref];
    }
    
    const aVal = disp(rowCells['A'+rNum]);
    const bVal = disp(rowCells['B'+rNum]);
    const cVal = disp(rowCells['C'+rNum]);
    
    // 判断行类型
    // 先算"该行除A列外是否还有独立数据"：真正的分区标题行（如"落地支架(Ground Stacking...)"）
    // 通常是孤立的单列单元格（只有A列有文本），B~其他列均为空。
    // 而像"可伸缩拉杆 _0.5m（可调范围420mm-600mm）"这类被误判为标题的，实际上是数据行
    // （B列有数量、C列有SAP、D列有描述、I列有重量），不应被当作分区标题。
    // 因此只有"仅A列有内容、其余列无独立数据"的行才允许被判为 section 标题。
    let rowHasDataBeyondA = false;
    for(let cc=2; cc<=maxCol; cc++){
      const ccol = numToCol(cc);
      if(ccol === 'A') continue;
      const cref = ccol + rNum;
      const cell = sheetData[cref];
      const hasVal = cell && cell.v !== undefined && String(cell.v).trim() !== '';
      if(hasVal || inputs.includes(cref)){
        rowHasDataBeyondA = true;
        break;
      }
    }
    // ★备注行必须是"非组件标题"才成立：CL V3 的包边组件标题文本自带"注意：CL V3包边方案下单前…"
    //   说明（如 A11"CL V3-包边组件（Trim Components）：箱体高度必须≥3…注意：…"），含"注意"字样，
    //   若被 isNote 判为备注行，会导致"包边组件"标题无法独立成 section、包边组件表与前一张组件表混在一起，
    //   表头错乱。故凡命中"背条/挂架/包边组件标题"特征的行，一律优先视为 section 标题，不当作备注。
    const isCompTitleLike = /(背条|挂架|包边)\s*组件|Wall Mounted Bracket Components|Trim\s*Components/.test(aVal) && !rowHasDataBeyondA;
    const isNote = !isCompTitleLike && aVal && /PS：|注：|备注|仅供参考|请勿|暂未|注意/.test(aVal);
    // 显式"类别"分组标题：用户在新版Excel里以黄色填充+"类别："前缀标记分类标题（如"类别：落地支架..."），
    // 这类行下方的内容即该分类的明细。除第1行主标题外，凡以"类别："开头的一律作为分组标题。
    const isCatSection = /^类别[:：]/.test(aVal) && rNum > 1;
    // 标准分区：以括号(+可选冒号)结尾且较短；或标准区块标题开头(括号后可能带附加说明，如NT V2的航空箱标题)
    // ★关键：排除"除A列外还有其他数据"的行，避免把数据行误判成分区标题（解决FL V2底部单独起标题的问题）
    const isStdSection = /[（(].*[)）]：?$/.test(aVal) && aVal.length < 60 && !rowHasDataBeyondA;
    const isLongSection = (/^落地支架\s*[（(]Ground Stacking/.test(aVal)
                       || /^方式[12][:：]/.test(aVal)
                       || /^航空箱Flight Cases/.test(aVal)) && !rowHasDataBeyondA;
    // ★备注行（PS：/注：/备注/仅供参考…）绝不能当作分区标题——它是数据区末尾的普通备注，
    // 应作为当前区块(方式2等)的最后一行 note-row 显示，而不是独立起一个标题/独立表格。
    // 组件类分组标题：如 "NX-包边组件（Trim Components）：计算公式仅支持..."。
    // 这类行只含A列(跨全表)且无其他列数据，是"包边组件明细"的分组标题/表头，
    // 应作为独立表格的标题显示（NX/XL/KLCOB/CL V3/ALT/K V3/K V4/M54/A55 等15个sheet都有）。
    const isTrimSection = /包边\s*组件|Trim\s*Components/.test(aVal) && !rowHasDataBeyondA;
    // ★背条/挂架/包边"组件明细"标题：含 "Wall Mounted Bracket Components" / "背条组件" / "挂架组件" 
    //   的行（仅A列有内容）也作为独立表格标题。K V3 的背条标题后带补充说明（如"(旧版本和V3X版本…
    //   可以用如下背条)"），不以括号结尾，无法被 isStdSection 捕获 → 背条组件表会与输入区混用一张表，
    //   导致无法与包边组件表列宽对齐。这里一并识别为组件标题，使其独立成表、参与跨表对齐。
    const isCompSection = /(背条|挂架|包边)\s*组件|Wall Mounted Bracket Components|[（(]\s*(Wall Mounted Bracket|Trim)\s*Components/.test(aVal) && !rowHasDataBeyondA;
    const isSection = aVal && !isNote && 
      (((isCatSection || isStdSection || isLongSection) && !/最大支持|排列方式|计算公式/.test(aVal)) 
       || isTrimSection || isCompSection);
    const isInputHeader = (/Width|Height|Quantity|宽度|高度|数量/.test(bVal+cVal) && !inputs.includes('B'+rNum));
    const isInputRow = aVal && /排列方式|Input screen/.test(aVal);
    
    // 第1行：标题栏（若带"类别："前缀则去掉，作为时表主标题清晰显示）
    if(rNum === 1){
      if(inSection){html += '</tbody></table></div></div>'; inSection=false;}
      let titleText = /^类别[:：]/.test(aVal) ? aVal.replace(/^类别[:：]\s*/,'') : aVal;
      html += '<div class="note-bar">'+titleText+'</div>';
      continue;
    }
    
    // section标题行
    if(isSection){
      if(inSection) html += '</tbody></table></div></div>';
      let extraClass = '';
      if(/方式2|新款航空箱/.test(aVal)) extraClass=' mode2-table';
      else if(/方式1|旧款航空箱/.test(aVal)) extraClass=' mode1-table';
      else if(/Ground Stacking/.test(aVal)) extraClass=' ground-table';
      currentTableClass = extraClass;
      // 显式"类别"标题（用户以黄色标记）：加 cat-title 样式，界面呈现为分类分组标题（去掉"类别："前缀冗余）
      // 但产品级主标题（落地支架Ground Stacking / 方式1 / 方式2）改为分类标题后，仍保持原来的蓝色底（table-section-title），
      // 只有真正的"类别：XXX"（明细分组）才用黄色 cat-section-title，确保这些主标题背景和之前一致。
      let titleText = isCatSection ? aVal.replace(/^类别[:：]\s*/,'') : aVal;
      let isProductSection = /^落地支架\s*[（(]Ground Stacking/.test(titleText)
                          || /^方式[12][:：]/.test(titleText)
                          || /^航空箱Flight Cases/.test(titleText);
      let titleClass = (isCatSection && !isProductSection) ? 'table-section-title cat-section-title' : 'table-section-title';
      html += '<div class="table-section"><div class="'+titleClass+'">'+titleText+'</div><div class="table-wrapper"><table class="data-table'+extraClass+'"><tbody>';
      inSection = true;
      continue;
    }
    
    // 确保在表格中
    if(!inSection){
      const hasContent = Object.values(rowCells).some(c=>disp(c)!=='');
      if(!hasContent) continue;
      html += '<div class="table-section"><div class="table-wrapper"><table class="data-table"><tbody>';
      inSection = true;
    }
    
    const rowHasContent = Object.values(rowCells).some(c=>disp(c)!=='');
    if(!rowHasContent) continue;
    
    let rowClass = isNote ? 'note-row' : (isSection ? 'section-header' : (isInputHeader ? 'input-header' : (isInputRow ? 'input-row' : '')));
    html += '<tr class="'+rowClass+'">';
    
    const rowHasInput = inputs.includes('B'+rNum);
    // 本行所有输入框的 ref（按列序），用于把「重置」按钮紧贴最后一个输入框放置
    const rowInputRefs = inputs.filter(r => parseInt(r.replace(/[A-Z]+/,''),10) === rNum);
    
    for(let ci=1; ci<=maxCol-minCol+1; ci++){
      const col = numToCol(ci + minCol - 1);
      const ref = col + rNum;
      const c = rowCells[ref];
      const val = disp(c);
      let tdClass = '';
    // 提示文字居左显示
    if(val && (/最大支持|请在左侧输入|Input cabinet arrangement/.test(val))){
      tdClass += ' left-align-text';
    }
      
      // 获取Excel对齐方式（全局生效，所有sheet）
      let excelHAlign = '';
      let excelVAlign = '';
      if(c && c.h){
        if(c.h === 'left') excelHAlign = 'text-align:left!important;';
        else if(c.h === 'center') excelHAlign = 'text-align:center!important;';
        else if(c.h === 'right') excelHAlign = 'text-align:right!important;';
        else if(c.h === 'default'){
          // Excel默认对齐：数字右对齐，文本左对齐
          if(val !== '' && !isNaN(parseFloat(val)) && /^-?\d+\.?\d*$/.test(val.trim())){
            excelHAlign = 'text-align:right!important;';
          }
        }
      }
      if(c && c.v_align){
        if(c.v_align === 'top') excelVAlign = 'vertical-align:top!important;';
        else if(c.v_align === 'center') excelVAlign = 'vertical-align:middle!important;';
        else if(c.v_align === 'bottom') excelVAlign = 'vertical-align:bottom!important;';
      }
            // 用户指定的对齐方式
      let userOverrideHAlign = '';
      
      // 1. 特定内容居左
      if(val.includes('落地支架最大支持5米高度') || val.includes('Maximum height of 5 meters') ||
         val.includes('请在左侧输入箱体排列') || val.includes('Input cabinet arrangement')){
        userOverrideHAlign = 'text-align:left!important;';
      }
      
      // 2. 物料描述、计算逻辑和配置列居左（找本列表头，不跨表格）
      if(!userOverrideHAlign && rNum >= 5){
        const headerVal = findColHeader(col, rNum);
        if(headerVal.includes('物料描述') || headerVal.includes('Material Description') ||
           headerVal.includes('计算逻辑') || headerVal.includes('Calculation Logic') ||
           headerVal.includes('配置') || headerVal.includes('Configuration')){
          userOverrideHAlign = 'text-align:left!important;';
        }
      }
      
      // 3. 输入区居中 —— 按内容/语义判断（列标题、输入行、输入框单元格），不依赖固定行号；
      //    因为提示文字（如"落地支架最大支持5米高度"/"请在左侧输入箱体排列"）在
      //    不同 sheet 里的行列位置不固定，第1步已按文字内容将其设为左对齐，
      //    这里用 !userOverrideHAlign 保证提示文字不被覆盖。
      if(!userOverrideHAlign && (isInputHeader || isInputRow || inputs.includes(ref))){
        // "公式优先选择双倍背条" 等提示性表头文字左对齐（跨列表头单元格）
        if(/公式优先选择/.test(val)) userOverrideHAlign = 'text-align:left!important;';
        else userOverrideHAlign = 'text-align:center!important;';
      }
      // 3.5 输入区提示性说明文字强制左对齐（不随输入区其它表头居中）：
      //     - "单个箱体尺寸1200*675mm"（A55/M54 输入区跨列说明，colspan=7）
      //     - "高度必须≥2，否则公式报错"（XL/KLCOB/KLCOB V2/KLCOB V3/CL V3 输入区公式约束说明）
      //     这些本质是输入区的说明/约束文字，而非列标题（"宽度/高度"那种才居中）。
      //     放在居中分支之后作更高优先级覆盖，确保任何数据版本/判定路径都稳定左对齐。
      if(/单个箱体尺寸|高度必须\s*[≥>=]\s*2|公式报错|否则公式/.test(val)){
        userOverrideHAlign = 'text-align:left!important;';
      }
      
      // 4. 组件名称、数量、SAP料号列居中（找本列表头，不跨表格）
      if(!userOverrideHAlign && rNum >= 5){
        const headerVal = findColHeader(col, rNum);
        if(headerVal.includes('组件名称') || headerVal.includes('Components') ||
           headerVal.includes('数量') || headerVal.includes('Quantity') ||
           headerVal.includes('SAP') || headerVal.includes('重量') || headerVal.includes('Weight') ||
           headerVal.includes('配棉') || headerVal.includes('装箱')){
          userOverrideHAlign = 'text-align:center!important;';
        }
      }
      
      let finalHAlign = userOverrideHAlign || excelHAlign;
      // 方式1配置列(第5列)整列强制居中，覆盖Excel原始对齐
      if(currentTableClass.indexOf('mode1-table')>=0 && ci===5){
        finalHAlign = 'text-align:center!important;';
      }
      // ★备注行(PS：/注：/备注等说明文字)统一左对齐 —— 覆盖数据里带的对齐(常见是 center)，
      //   符合备注说明的阅读习惯；PS行跨全表时 findColHeader 可能误命中"配棉/装箱"等返回居中，这里强制归位。
      if(isNote){
        finalHAlign = 'text-align:left!important;';
      }
      const excelAlignStyle = (finalHAlign || excelVAlign) ? ' style="'+finalHAlign+excelVAlign+'"' : '';
      const origCi = ci + minCol - 1;
      const mergeInfo = sheetMergeMap[rNum+'_'+origCi];
      
      if(mergeInfo && mergeInfo.merged) continue;
      
      let mergeAttr = '';
      if(mergeInfo){
        if(mergeInfo.rowspan > 1){mergeAttr += ' rowspan="'+mergeInfo.rowspan+'"'; tdClass += ' row-merge';}
        if(mergeInfo.colspan > 1){mergeAttr += ' colspan="'+mergeInfo.colspan+'"'; tdClass += ' col-merge';}
      }
      
      // 公式单元格添加标记（确保所有有公式的单元格都被正确处理）
      if(c && c.f){
        tdClass += ' formula-cell num-cell';
        // 严格按照Excel对齐方式
        const formulaStyle = excelAlignStyle || ' style="text-align:center!important;vertical-align:middle!important;"';
        const styleAttr = mergeAttr ? mergeAttr + formulaStyle : formulaStyle;
        html += '<td class="'+tdClass+'"'+styleAttr+' data-formula-ref="'+ref+'">'+val+'</td>';
        continue;
      }
      
      // 特殊class
      if(col === 'B' && val !== '' && !isNaN(parseFloat(val))) tdClass += ' cell-qty';
      if(/重量|Weight|KG/.test(val)) tdClass += ' cell-weight';
      if(/请在左侧输入/.test(val)) tdClass += ' hint-cell';
      // SAP料号列：仅当该列标题确为"SAP料号"时保持不换行(nowrap)，避免料号断行；
      // 同时不误伤航空箱表的"配棉"等长文字列(它们在nth-child(3)位置但需换行防溢出)
      if(rNum >= 5){
        const hdrVal = findColHeader(col, rNum);
        if(/SAP/.test(hdrVal) && /料号|Number|SAP/.test(hdrVal)) tdClass += ' col-sap';
      }
      // 重量列明细（以KG结尾，如"≈7.2KG"/"49.5KG"）不允许换行——加 nowrap，靠列宽保证单行显示
      if(!isInputHeader && !isSection && !isNote && /KG\s*$/i.test(val.trim())) tdClass += ' w-nowrap';
      
      // 数字单元格居中（纯数字，且不是表头行）
      if(!isInputHeader && !isSection && !isNote && val !== '' && !isNaN(parseFloat(val)) && /^\d+\.?\d*$/.test(val.trim())){
        tdClass += ' num-cell';
      }
      // 物料描述列居左（长文本）
      if(!isInputHeader && !isSection && !isNote && val.length > 20 && !/^\d/.test(val)){
        tdClass += ' desc-cell';
      }
      // 珍珠棉物料描述列居左（包含"环保珍珠棉"的内容）
      if(!isInputHeader && !isSection && !isNote && val.includes('环保珍珠棉')){
        tdClass += ' desc-cell pearl-cotton-desc';
      }
      
      // 输入框
      if(inputs.includes(ref)){
        html += '<td class="'+tdClass+'"'+mergeAttr+excelAlignStyle+'><input type="number" min="0" value="0" data-ref="'+ref+'" oninput="recalculateFormulas()"></td>';
        // 「重置」按钮放到本输入区块的【第一行】末尾，紧跟该行最后一个输入框（贴近数字）。
        // 条件：本行是输入块起始行（本行有输入框、且上一行无输入框），这样多输入行sheet(如K V4)也只放1个按钮。
        const prevRowInputs = inputs.filter(r => parseInt(r.replace(/[A-Z]+/,''),10) === rNum - 1).length;
        if(rowInputRefs.length && !prevRowInputs && ref === rowInputRefs[rowInputRefs.length - 1]){
          html += '<td class="reset-cell"><button class="input-reset-btn" onclick="resetSheetInput()" title="把本输入区的宽度/高度重置为0">↺ 重置</button></td>';
        }
        continue;
      }
      
      // 普通单元格 - 换行处理
      // 表头单元格：把"中文 英文"混合表头拆成两行（中文一行、英文一行，最多2行），避免挤成一坨或溢出
      let rawVal = val;
      if(headerRows.has(rNum) || isInputHeader){
        // 表头单元格强制最多2行（隐藏第3行及以上内容），靠列宽自适应保证2行内放得下；
        // 行合并(row-merge)的单元格除外，避免裁剪跨行表头
        if(tdClass.indexOf('row-merge') < 0) tdClass += ' hdr-2';
        let split = splitCNEN(rawVal);
        if(split !== rawVal) rawVal = split; // 只有真正中英混合且可拆分时才换行
      }
      let dispVal = rawVal.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
      html += '<td class="'+tdClass+'"'+mergeAttr+excelAlignStyle+'>'+dispVal+'</td>';
    }
    html += '</tr>';
  }
  
  if(inSection) html += '</tbody></table></div></div>';
  
  container.innerHTML = html;
  // 按表头结构校正每张表的类型类（固定列宽/对齐依赖这些类）。
  // 兼容区块标题超长未被识别为section、或标题不含"方式1/2"的产品（如NT V2、AX、FL V2）。
  // 方式2=含珍珠棉/装箱数量(9列)；方式1=航空箱名称开头(6列,含配置)；落地支架=组件名称开头+SAP+计算逻辑(6列)
  container.querySelectorAll('table.data-table').forEach(function(t){
    var kind=null;
    var headRows=t.querySelectorAll('tr');
    for(var k=0;k<Math.min(4,headRows.length);k++){
      var cells=headRows[k].children;
      var c0=cells[0]?cells[0].textContent:'';
      var rowTxt=headRows[k].textContent;
      if(/组件名称|航空箱名称/.test(c0)){
        if(/珍珠棉|装箱数量/.test(rowTxt)) kind='mode2-table';
        else if(/^\s*航空箱名称/.test(c0)) kind='mode1-table';
        // 仅落地支架产品的组件表用ground固定列宽；背条/挂架/包边表虽表头相同，但保持原auto布局
        else if(/落地支架/.test(currentSheet) && /^\s*组件名称/.test(c0) && cells[2] && /SAP/i.test(cells[2].textContent)) kind='ground-table';
        break;
      }
    }
    if(kind){
      t.classList.remove('mode1-table','mode2-table','ground-table');
      t.classList.add(kind);
    }
    // 数据驱动列宽：根据表头语义生成 colgroup，精确控制每列宽度
    applySmartColumnWidths(t);
    // 按列对齐：同一列所有数据单元格统一对齐（SAP居中/逻辑描述居左/数量重量居中）
    applyColumnAlignment(t);
  });

  // —— 跨表列宽对齐：同一个sheet里 落地支架/方式1/方式2 三张表的
  //    前几列（名称/数量/SAP/物料描述，以及方式1/落地支架各自的逻辑/配置、重量）
  //    使用统一列宽，使各列在视觉上上下对齐 ——
  alignFirstColsAcrossTables(container);
}

// —— 按"表头语义"(逻辑列)分组，把某张表所有物理列(含合并跨列)累计成逻辑列宽 ——
// 返回 {name, qty, sap, desc, logic, weight} 各组在 colgroup 里的实际总宽(px)。
// firstOnly=true 时每种语义只累计"第一次出现的那个相邻组"，忽略后续同类型列
//（用于方式2当基准：其有多个"数量"类列，只能取首个"航空箱总数"作为统一基准）。
function getLogicalGroupWidths(table, firstOnly){
  var cg = table.querySelector('colgroup'); if(!cg) return {};
  var cols = Array.prototype.slice.call(cg.children);
  var hdr = getHeaderRowForTable(table); if(!hdr) return {};
  // 展开表头行 → 每个物理列的类型
  var phyType = [];
  var pos = 0;
  Array.prototype.forEach.call(hdr.children, function(td){
    var cs = parseInt(td.getAttribute('colspan'))||1;
    var t = colTypeByHeader((td.textContent||'').trim());
    for(var k=0;k<cs;k++){ phyType[pos+k] = t; }
    pos += cs;
  });
  var sums = {name:0, qty:0, sap:0, desc:0, logic:0, weight:0};
  var seen = {}; // 记录某类型是否已累计过（firstOnly用）
  for(var i=0; i<cols.length && i<phyType.length; ){
    var t = phyType[i];
    var j = i;
    while(j < cols.length && phyType[j] === t) j++;   // 相邻同类型 = 一个语义组
    if(t && sums[t]!==undefined && (!firstOnly || !seen[t])){
      for(var m=i;m<j;m++){ sums[t] += (parseFloat(cols[m].style.width)||0); }
      seen[t] = true;
    }
    i = j;
  }
  return sums;
}
// —— 非逻辑(备注/other)列累计总宽 —— 用于判断一张结构表右侧是否有"备注/注意事项"这类列，
//    以便在跨表列宽对齐时为它们【预留最小宽度】(否则会被前6明细列挤到0宽，长文本暴力折行撑高行高)。
function getOtherGroupWidths(table){
  var cg = table.querySelector('colgroup'); if(!cg) return 0;
  var cols = Array.prototype.slice.call(cg.children);
  var hdr = getHeaderRowForTable(table); if(!hdr) return 0;
  var phyType = [];
  var pos = 0;
  Array.prototype.forEach.call(hdr.children, function(td){
    var cs = parseInt(td.getAttribute('colspan'))||1;
    var t = colTypeByHeader((td.textContent||'').trim());
    for(var k=0;k<cs;k++){ phyType[pos+k] = t; }
    pos += cs;
  });
  var total = 0;
  for(var i=0;i<cols.length && i<phyType.length;i++){
    if(phyType[i]==='other'){ total += (parseFloat(cols[i].style.width)||0); }
  }
  return total;
}
// 按逻辑列宽度序列(逻辑列0=name,1=qty,2=sap,3=desc,4=logic,5=weight)重设一张表的列宽。
// 定位含合并跨列的表头：把每个语义组(相邻同类型物理列)的总宽设为对应的逻辑列目标宽，
// 组内各物理列按原宽度占比分摊，从而在保持内部比例的同时让"逻辑列(如物料描述)"在三表对齐。
function applyLogicalWidths(table, logicalTargets, otherReserve){
  var cg = table.querySelector('colgroup'); if(!cg) return;
  var cols = Array.prototype.slice.call(cg.children);
  var hdr = getHeaderRowForTable(table); if(!hdr) return;
  var phyType = [];
  var pos = 0;
  Array.prototype.forEach.call(hdr.children, function(td){
    var cs = parseInt(td.getAttribute('colspan'))||1;
    var t = colTypeByHeader((td.textContent||'').trim());
    for(var k=0;k<cs;k++){ phyType[pos+k] = t; }
    pos += cs;
  });
  // 每个语义类型对应的逻辑列目标宽
  var idxByName = {name:0, qty:1, sap:2, desc:3, logic:4, weight:5};
  var headSum = 0;   // 逻辑列(seq有目标值)之和 —— 这些列统一用 seq 基准宽(跨表对齐)
  var tailSum = 0;   // 非逻辑(other)列当前宽度之和
  var tailGroups = [];  // 记录 other 列的 [start,end] 物理列下标
  var logicGroups = []; // 记录逻辑列(有seq目标值)的 [start,end] 物理列下标
  var i = 0;
  while(i < cols.length){
    var type = phyType[i];
    var j = i;
    while(j < cols.length && phyType[j] === type) j++;   // 相邻同类型物理列 = 一个语义组
    var gcols = j - i;
    var lgIdx = idxByName[type];
    var target = (lgIdx !== undefined && logicalTargets[lgIdx]) ? logicalTargets[lgIdx] : 0;
    if(target > 0 && gcols > 0){   // 逻辑列(name/qty/sap/desc/logic/weight)：统一设为 seq 基准(跨表对齐)
      var groupSum = 0;
      for(var m=i;m<j;m++){ groupSum += (parseFloat(cols[m].style.width)||0); }
      if(groupSum <= 0){ var each = target/gcols; for(var m2=i;m2<j;m2++){ cols[m2].style.width = each.toFixed(1)+'px'; } }
      else { for(var m3=i;m3<j;m3++){ var sc = (parseFloat(cols[m3].style.width)||0)*(target/groupSum); cols[m3].style.width = sc.toFixed(1)+'px'; } }
      headSum += target;
      logicGroups.push([i,j]);
    } else {   // 非逻辑(other)列：保留原宽，纳入尾部
      var groupReal = false;
      for(var m4=i;m4<j;m4++){ var cw=(parseFloat(cols[m4].style.width)||0); if(cw>=10){ tailSum += cw; groupReal=true; } }
      if(groupReal) tailGroups.push([i,j]);
    }
    i = j;
  }
  // ★铺满容器且【优先保证逻辑列跨表对齐】：
  //   逻辑列统一设为 seq 基准宽(跨表一致)；剩余空间给 other 列。
  //   仅当"逻辑列之和"本身超容器时，才把逻辑列等比缩到 avail(同 seq→同 scale→跨表仍一致)，
  //   并把 other 列压到最小——绝不因 other 列挤占而缩小逻辑列(否则跨表对齐失效)。
  var avail = getTableAvailableWidth(table);
  var total = headSum;   // 逻辑列基准之和；逻辑列不因 other 列缩放，保证跨表对齐
  var hasTail = tailGroups.length > 0 && tailSum > 0;
  // ★为右侧"备注/注意"等 other 列预留最小宽度：
  //   否则(逻辑列占满容器时)other 列被压到 0 宽，长文本暴力折行会把行高撑到几百px(见 KLCOB 包边组件表)。
  //   otherReserve 由 alignFirstColsAcrossTables 对整组统一算出(跨表一致)——
  //   即便【本表】无实质 other 列，也把明细列缩到 (avail-otherReserve)，保证与「含备注列的表」明细列对齐。
  if(otherReserve > 0 && avail > 0 && headSum > 0){
    var logicAvail = avail - otherReserve;
    if(logicAvail <= 0) logicAvail = Math.max(avail - 8, 1);   // 极端保守兜底
    var lgScale = logicAvail / headSum;
    if(lgScale > 1) lgScale = 1;   // 明细列未超可用空间时不放大(保持 seq 基准)，gap 作为右侧留白
    for(var lg2=0; lg2<logicGroups.length; lg2++){ var l0b=logicGroups[lg2][0], l1b=logicGroups[lg2][1];
      for(var m7b=l0b;m7b<l1b;m7b++){ var cwLb=(parseFloat(cols[m7b].style.width)||0);
        if(cwLb>0){ cols[m7b].style.width=(cwLb*lgScale).toFixed(1)+'px'; } } }
    if(hasTail){   // 本表有备注列：把预留给它的 otherReserve 按各列原宽占比分摊，长备注在合理宽度内折行
      for(var ogB=0; ogB<tailGroups.length; ogB++){ var o0b=tailGroups[ogB][0], o1b=tailGroups[ogB][1];
        for(var m8b=o0b;m8b<o1b;m8b++){ var cwOb=(parseFloat(cols[m8b].style.width)||0);
          var share = tailSum>0 ? otherReserve*(cwOb/tailSum) : otherReserve/tailGroups.length;
          cols[m8b].style.width = share.toFixed(1)+'px'; } }
    }
    // 无备注列的表：右侧不填充该 reserve，明细列保持在 logicAvail，右侧留白 → 明细列仍与含备注列表对齐
    // total 以"列宽实际总和"为准，避免 lgScale 封顶(未缩放)时列宽与逻辑预留不一致带来的浮点多算/拉伸
    var scaledSum = 0;
    for(var miS=0; miS<cols.length; miS++){ scaledSum += (parseFloat(cols[miS].style.width)||0); }
    total = scaledSum;
  } else if(avail > 0 && headSum > 0){
    var rest = avail - headSum;   // 逻辑列占满后剩余给 other 列的空间(可为负=逻辑列超容器)
    if(hasTail){
      if(rest >= 0){   // 逻辑列未超容器：逻辑列保持 seq 基准(跨表对齐)，other 列占 rest(放大或压缩)
        var scale2 = rest / tailSum;
        for(var g=0;g<tailGroups.length;g++){ var s0=tailGroups[g][0], s1=tailGroups[g][1];
          for(var m5=s0;m5<s1;m5++){ cols[m5].style.width = (parseFloat(cols[m5].style.width)*scale2).toFixed(1)+'px'; } }
      } else {   // 逻辑列已超容器：只把逻辑列等比缩到 avail(同 scale，跨表仍一致)，other 列压到极小
        var scale = avail / headSum;
        for(var lg=0; lg<logicGroups.length; lg++){ var l0=logicGroups[lg][0], l1=logicGroups[lg][1];
          for(var m7=l0;m7<l1;m7++){ var cwL=(parseFloat(cols[m7].style.width)||0); if(cwL>0){ cols[m7].style.width=(cwL*scale).toFixed(1)+'px'; } } }
        for(var og=0; og<tailGroups.length; og++){ var o0=tailGroups[og][0], o1=tailGroups[og][1];
          for(var m8=o0;m8<o1;m8++){ var cwO=(parseFloat(cols[m8].style.width)||0); if(cwO>0){ cols[m8].style.width=Math.min(cwO*scale,8).toFixed(1)+'px'; } } }
      }
      total = avail;
    } else if(avail !== headSum){
      // 无 other 列：逻辑列等比缩放铺满容器(同一scale，仍跨表对齐)。headSum 可能>或<avail
      var scale3 = avail/headSum;
      for(var mi2=0;mi2<cols.length;mi2++){ var cwB=(parseFloat(cols[mi2].style.width)||0); if(cwB>0){ cols[mi2].style.width=(cwB*scale3).toFixed(1)+'px'; } }
      total = avail;
    }
  }
  // ★精确化列宽总和：colgroup 各列用 toFixed(1) 会带来 ±0.x px 浮点误差，
  //   导致"列宽总和(1712.6)"略大于表宽(1712)，table-layout:fixed 下表格被撑宽、右缘超出容器 2px。
  //   这里把最后一列微调，使 colgroup 列宽总和精确 = total，杜绝水平溢出。
  if(cols.length > 1){
    var actualSum = 0;
    for(var mi=0; mi<cols.length; mi++){ actualSum += (parseFloat(cols[mi].style.width)||0); }
    var diff = total - actualSum;
    if(Math.abs(diff) > 0.05){
      // 把误差塞给 colgroup 里最后一个"实质列"(宽≥10px)，避免塞给 1px 空列吸收不掉
      for(var mi3=cols.length-1; mi3>=0; mi3--){
        if((parseFloat(cols[mi3].style.width)||0) >= 10){
          var nw = (parseFloat(cols[mi3].style.width)||0) + diff;
          if(nw >= 1){ cols[mi3].style.width = nw.toFixed(1)+'px'; }
          break;
        }
      }
    }
  }
  // ★固定宽度对齐关键：把表格宽度由 100% 改为"列宽总和(px)"，
  //   否则 table-layout:fixed + width:100% 会把 colgroup 按比例放大到铺满容器，
  //   导致列宽对齐失效、表1/2被拉伸（右侧不再留白）。
  //   注意：CSS 里 .data-table 有 min-width:100%，必须同时用内联覆盖 min-width，
  //   否则 min-width(100%) 会压过 max-width，表格仍被撑到全宽。
  table.style.width = total.toFixed(1)+'px';
  table.style.maxWidth = total.toFixed(1)+'px';
  table.style.minWidth = total.toFixed(1)+'px';
}
// 让方式2表的前4列(名称/总数/SAP/描述)与落地支架/方式1 采用相同的 seq 列宽，
// 其余列(配棉/装箱/配棉数量/组件数量/航空箱数量)平分剩余空间，从而让方式2表的【总宽】与落地支架表完全一致，
// 实现"落地支架/方式1/方式2 三个页面总宽度一样"。
function applyMode2MatchWidth(m2, seq, targetW){
  if(!targetW || targetW<=0) return;
  var cg = m2.querySelector('colgroup'); if(!cg) return;
  var cols = Array.prototype.slice.call(cg.children);
  var hdr = getHeaderRowForTable(m2); if(!hdr) return;
  var phyType = [];
  var pos = 0;
  Array.prototype.forEach.call(hdr.children, function(td){
    var cs = parseInt(td.getAttribute('colspan'))||1;
    var t = colTypeByHeader((td.textContent||'').trim());
    for(var k=0;k<cs;k++){ phyType[pos+k] = t; }
    pos += cs;
  });
  var idxByName = {name:0, qty:1, sap:2, desc:3, logic:4, weight:5};
  var firstFour = 0;
  var headCnt = Math.min(4, cols.length);   // 方式2前4列 = 名称/总数/SAP/珍珠棉描述
  for(var i=0;i<headCnt;i++){
    var lg = idxByName[phyType[i]];
    if(lg !== undefined && seq[lg]){
      cols[i].style.width = seq[lg].toFixed(1)+'px';
      firstFour += seq[lg];
    }
  }
  // 剩余列(第5列起：配棉/装箱/配棉数量/组件数量/航空箱数量)平分 targetW 剩余空间
  var rest = targetW - firstFour;
  var restCnt = cols.length - headCnt;
  if(rest > 0 && restCnt > 0){
    var each = rest/restCnt;
    for(var k=headCnt;k<cols.length;k++){ cols[k].style.width = each.toFixed(1)+'px'; }
  }
  // ★精确化方式2列宽总和 = targetW，避免 `each.toFixed(1)` 浮点误差导致表宽超出容器
  if(cols.length > 1){
    var act2 = 0;
    for(var mi2=0; mi2<cols.length; mi2++){ act2 += (parseFloat(cols[mi2].style.width)||0); }
    var diff2 = targetW - act2;
    if(Math.abs(diff2) > 0.05){
      for(var mi4=cols.length-1; mi4>=0; mi4--){
        if((parseFloat(cols[mi4].style.width)||0) >= 10){
          var nw2 = (parseFloat(cols[mi4].style.width)||0) + diff2;
          if(nw2 >= 1){ cols[mi4].style.width = nw2.toFixed(1)+'px'; }
          break;
        }
      }
    }
  }
  // 固定方式2表宽 = targetW，使其总宽与落地支架/方式1 完全一致（而非被撑到容器全宽）
  m2.style.width = targetW.toFixed(1)+'px';
  m2.style.maxWidth = targetW.toFixed(1)+'px';
  m2.style.minWidth = targetW.toFixed(1)+'px';
}
// 同一 sheet 内 落地支架(ground)/方式1(mode1)/方式2(mode2) 三张表列宽对齐：
//   逻辑列 名称(0)/数量(1)/SAP料号(2)/物料描述(3) 以【方式2】的宽度为统一基准，三表完全对齐；
//   落地支架/方式1 的 计算逻辑/配置(4)、重量(5) 在两者之间取一致（取较宽者），实现上下对齐；
//   方式2 表整体总宽锁定为与落地支架/方式1 相同，使三个页面总宽度一致。
function alignFirstColsAcrossTables(container){
  // 注意：AX落地支架等 sheet 的"落地支架表+航空箱表"都标记为 ground-table，
  // 需收集【全部】ground表，不能只留一张，否则落地支架表与航空箱表列宽无法统一。
  var grounds = [], m1=null, m2=null;
  container.querySelectorAll('table.data-table').forEach(function(t){
    if(t.classList.contains('ground-table')) grounds.push(t);
    else if(t.classList.contains('mode1-table')) m1 = t;
    else if(t.classList.contains('mode2-table')) m2 = t;
  });
  var g = grounds.length ? grounds[0] : null;   // 落地支架基准表（取第一张ground）
  // —— 有方式2表：沿用原有逻辑（PL V3 等）：前4列以方式2为基准，三表对齐，方式2锁宽 ——
  if(m2){
    var wg = g ? getLogicalGroupWidths(g) : {};
    var wm1 = m1 ? getLogicalGroupWidths(m1) : {};
    var w2 = getLogicalGroupWidths(m2, true);   // 方式2 作基准：每种语义只取首个列(航空箱总数等)
    if(!(w2.name && w2.qty && w2.sap && w2.desc)) return;
    // 逻辑列 名称/数量/SAP/描述 以方式2为基准；逻辑/配置、重量取落地支架与方式1的较宽者
    var seq = [
      w2.name,
      w2.qty,
      w2.sap,
      w2.desc,
      Math.max(wg.logic||0, wm1.logic||0),
      Math.max(wg.weight||0, wm1.weight||0)
    ];
    // 落地支架/方式1 前几列应用统一列宽(固定宽度)
    if(g) applyLogicalWidths(g, seq);
    if(m1) applyLogicalWidths(m1, seq);
    // 方式2 前4列用同一 seq、总宽统一到落地支架表的宽度
    var targetW = g ? parseFloat(g.style.width) : (m1 ? parseFloat(m1.style.width) : 0);
    applyMode2MatchWidth(m2, seq, targetW);
    return;
  }
  // —— 无方式2表：让 sheet 内所有结构表（可有多张ground，如AX落地支架的落地支架表+航空箱表）
  //    前几列(名称/数量/料号/描述)统一对齐，消除"上下没对齐"与"右侧列被压缩" ——
  var struct = grounds.slice();
  if(m1) struct.push(m1);
  // ★背条/挂架/包边类sheet（NX/XL/KLCOB/ALT/K V4/M54/A55等）：其"组件表+包边表"是两张同构结构表，
  //   但 sheet 名不含"落地支架"，从未被标为 ground/mode1/mode2，因此没有被纳入跨表对齐 → 上下错位。
  //   这里额外扫描容器内所有"表头首列=组件名称"的同构结构表(排除航空箱表)，一并纳入统一列宽对齐。
  container.querySelectorAll('table.data-table').forEach(function(t){
    var hdr=getHeaderRowForTable(t); if(!hdr||!hdr.children||!hdr.children[0]) return;
    var c0=(hdr.children[0].textContent||'').trim();
    if(!/组件名称|Components/.test(c0)) return;   // 只取"组件表"，排除航空箱(mode1)表
    if(struct.indexOf(t)>=0) return;               // 已在 grounds/m1 里，避免重复
    struct.push(t);
  });
  // 只保留真正含 名称+数量+料号+描述 的结构表
  struct = struct.filter(function(t){ var w=getLogicalGroupWidths(t); return t && w.name>0 && w.qty>0 && w.sap>0 && w.desc>0; });
  if(struct.length === 0) return;
  // 各逻辑列取组内所有表的较宽者作为统一基准
  var seq2 = [0,0,0,0,0,0];
  var names = ['name','qty','sap','desc','logic','weight'];
  struct.forEach(function(t){
    var w = getLogicalGroupWidths(t);
    for(var i=0;i<names.length;i++){ if(w[names[i]]>seq2[i]) seq2[i]=w[names[i]]; }
  });
  if(!(seq2[0] && seq2[1] && seq2[2] && seq2[3])) return;
  // ★只约束"前6逻辑列之和 ≤ 容器宽"，保证多张结构表的前6列(名称/数量/SAP/描述/逻辑/重量)完全跨表对齐。
  //   备注/空列等其他列不再"完全挤占"——为它们预留一个最小宽度(见下)，避免长备注文本被压到0宽暴力折行撑高行高。
  var avail2 = getTableAvailableWidth(struct[0]);
  // ★计算整组"其他(备注/注意)列"应预留的宽度：取组内所有结构表其他列内容宽度的最大值，并封顶，
  //   使英文长备注(如KLCOB"用于左右包边同时有上下倒角…")得以在合理宽度内折行，而非撑成几百px高的行。
  var MAX_OTHER_RESERVE = 176;   // 备注列最大预留宽(px)；够容纳约2行中文备注，又不至于过度压缩明细列
  var otherReserve = 0;
  struct.forEach(function(t){
    var ow = getOtherGroupWidths(t);
    if(ow > otherReserve) otherReserve = ow;
  });
  if(otherReserve > MAX_OTHER_RESERVE) otherReserve = MAX_OTHER_RESERVE;
  // 若备注列内容过少(如仅几十px)，不必为了它牺牲明细列宽度 → 不预留(交给 applyLogicalWidths 自然分配)
  if(otherReserve < 30) otherReserve = 0;
  var seqSum = seq2[0]+seq2[1]+seq2[2]+seq2[3]+seq2[4]+seq2[5];
  if(avail2 > 0 && seqSum + otherReserve > avail2){
    var seqScale = (avail2 - otherReserve) / seqSum;   // 预留 otherReserve 后，明细列等比缩到剩余空间(跨表仍一致)
    for(var si=0; si<seq2.length; si++){ seq2[si] = Math.round(seq2[si]*seqScale*10)/10; }
  }
  // 让无备注/空列的表(如NX)尾部也占满:其余列本来由 applyLogicalWidths 按 rest=avail-headSum 填充
  struct.forEach(function(t){ applyLogicalWidths(t, seq2, otherReserve); });
}

function exportExcel(){
  // 简单的CSV导出
  const sheetData = ALL_DATA[currentSheet] || {};
  const inputs = INPUT_MAP[currentSheet] || [];
  
  let maxRow = 0;
  let maxCol = 9;
  for(const ref in sheetData){
    const m = ref.match(/([A-Z]+)(\d+)/);
    if(m){
      const row = parseInt(m[2]);
      if(row > maxRow) maxRow = row;
    }
  }
  
  let csv = '\uFEFF';
  for(let r=1; r<=maxRow; r++){
    const row = [];
    for(let ci=1; ci<=maxCol; ci++){
      const col = numToCol(ci);
      const ref = col + r;
      const c = sheetData[ref];
      let v = c ? (c.v || '') : '';
      v = String(v).replace(/\n/g, ' ').replace(/"/g, '""');
      row.push('"'+v+'"');
    }
    csv += row.join(',') + '\n';
  }
  
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = currentSheet + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function excelDateToDate(serial){
  if(!serial || isNaN(parseFloat(serial))) return serial;
  const utcDays = Math.floor(serial - 25569);
  const utcValue = utcDays * 86400;
  const dateInfo = new Date(utcValue * 1000);
  const year = dateInfo.getFullYear();
  const month = String(dateInfo.getMonth() + 1).padStart(2, '0');
  const day = String(dateInfo.getDate()).padStart(2, '0');
  return year + '-' + month + '-' + day;
}

// 打开更新履历
function openUpdateLog(){
  const content = document.getElementById('updateLogContent');
  let html = '<table class="update-log-table"><thead><tr><th style="width:100px">日期</th><th>修订内容</th><th style="width:80px">编辑人</th></tr></thead><tbody>';
  
  // 履历数据源：优先用 ALL_DATA 里的履历类sheet（如「更新履历」/「履历」，随Excel同步）；无则回退到内置 UPDATE_LOG
  const histSheetName = Object.keys(ALL_DATA).find(n => /履历/.test(n));
  const histData = histSheetName ? ALL_DATA[histSheetName] : UPDATE_LOG;
  
  // 按行排序
  const rows = {};
  for(const ref in histData){
    const m = ref.match(/([A-Z]+)(\d+)/);
    if(m){
      const row = parseInt(m[2]);
      const col = m[1];
      if(!rows[row]) rows[row] = {};
      rows[row][col] = histData[ref].v;
    }
  }
  
  const sortedRows = Object.keys(rows).sort((a,b)=>parseInt(a)-parseInt(b));
  for(const rowNum of sortedRows){
    const row = rows[rowNum];
    if(rowNum == 1) continue; // 跳过表头
    const date = row.A ? excelDateToDate(row.A) : '';
    const content_text = row.B || '';
    const editor = row.C || '';
    html += '<tr><td>' + date + '</td><td>' + content_text + '</td><td>' + editor + '</td></tr>';
  }
  
  html += '</tbody></table>';
  content.innerHTML = html;
  document.getElementById('updateLogModal').classList.add('active');
}

<script>
// 加载外部数据
async function loadDataFromJson(){
  try{
    const resp=await fetch('structural-sfittings.json');
    if(!resp.ok)throw new Error('加载失败');
    const data=await resp.json();
    if(data.ALL_DATA&&Object.keys(data.ALL_DATA).length>0){
      ALL_DATA=data.ALL_DATA;
      INPUT_MAP=data.INPUT_MAP||{};
      MERGE_MAP=data.MERGE_MAP||{};
      console.log('已从 structural-sfittings.json 加载数据：'+Object.keys(ALL_DATA).length+' 个工作表');
      return true;
    }
  }catch(e){
    console.warn('structural-sfittings.json 加载失败（本地打开时属正常现象，部署到服务器后自动加载）');
  }
  return false;
}

// 页面加载完成后生成所有sheet下拉选项并自动计算
window.addEventListener('load', async function(){
  // 先加载外部数据
  await loadDataFromJson();
  
  // 生成所有sheet下拉选项
  const sheetSelect = document.getElementById('sheetSelect');
  if(sheetSelect){
    const currentValue = sheetSelect.value;
    sheetSelect.innerHTML = '';
    Object.keys(ALL_DATA).forEach(name => {
      // 跳过履历类sheet（履历/更新履历，没有输入框），履历只在右下角独立按钮展示
      if(/履历/.test(name)) return;
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      sheetSelect.appendChild(option);
    });
    if(ALL_DATA[currentValue] && !/履历/.test(currentValue)){
      sheetSelect.value = currentValue;
    }else{
      currentSheet = Object.keys(ALL_DATA).find(n => !/履历/.test(n)) || Object.keys(ALL_DATA)[0];
      sheetSelect.value = currentSheet;
    }
  }
  
  // 渲染表格
  if(typeof renderTable === 'function'){
    renderTable();
  }
  if(typeof updateAttachmentDisplay === 'function'){
    updateAttachmentDisplay();
  }
  
  // 自动计算一次
  setTimeout(function(){
    if(typeof recalculateFormulas === 'function'){
      recalculateFormulas();
    }
  }, 200);
});
</script>
